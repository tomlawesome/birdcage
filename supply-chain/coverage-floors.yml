  internal/agent/receiver: 95
  internal/agent/snmp: 82
  internal/agent/tailer: 77
  internal/api: 84
  internal/audit: 94
  internal/ca: 76
  internal/db: 87           # 88.3% measured with -race and Postgres, 2026-09-23
