# Go test-coverage floors, one per package. Read by scripts/coverage-floor.py,
# which runs against `go test ./... -coverprofile=...` in the `test:go` job in
# .gitlab-ci.yml, on every merge request and on push to dev.
#
# STATEMENT coverage, not branch coverage. Go's own toolchain (`go test
# -cover`, `go tool cover`) only ever measures which statements ran, not which
# branches of a condition did -- there is no branch-coverage mode to turn on.
# Owner policy (2026-09-20, issue #74) talks about a 70-85% band; every number
# below is the statement-coverage reading of that band, because statement
# coverage is the only number this toolchain can produce. Treat a package at
# 100% here as "every line ran at least once", not as "every branch was
# exercised".
#
# This is a RATCHET, not a fixed target:
#   - each floor below is set at the value measured on 2026-09-20, rounded
#     DOWN to a whole percent -- not at 70 -- so introducing this file does not
#     turn the build red over coverage nobody has touched.
#   - a floor only ever goes UP, when a package's coverage genuinely improves.
#     Never lower one to make a change pass -- if a change would require that,
#     the change needs more tests, not a smaller floor. (internal/startcheck's
#     floor moving down below is not that: it is a correction of a floor that
#     was measured wrong in the first place -- see below.)
#   - scripts/coverage-floor.py also fails a package sitting more than 5
#     points ABOVE its floor -- the script's own RATCHET_SLACK, set loose on
#     purpose so a single new test on a small package does not turn the build
#     red for improving coverage. That is stale ratchet, not a passing check,
#     and the fix is to raise the floor in this file to lock the gain in, not
#     to leave the extra headroom sitting there.
#   - the 70-85% band itself is not chased past 85%: a package already inside
#     it is done, and effort belongs on packages below 70%, not on pushing an
#     87% package toward 100%.
#
# Pipeline 1341 failed test:go on exactly this file being measured wrong.
# Floors must be measured under the same conditions .gitlab-ci.yml's test:go
# job uses, not on a plain workstation `go test ./...`, and getting that wrong
# moves numbers in BOTH directions:
#
#   - BIRDCAGE_TEST_DATABASE_URL must be set, against a real Postgres, the way
#     test:go does. Without it, tests fall back to SQLite and internal/db's
#     Postgres-only paths never run, reading far LOWER than CI (44% locally
#     vs. 67% against real Postgres).
#   - internal/startcheck used to have a second gotcha, fixed by #93: its
#     permission-refusal tests skip themselves as uid 0 (skipIfRoot), and
#     test:go ran as root, so they never ran in CI and the package read
#     LOWER there than on a workstation. test:go now drops to a non-root
#     user for the test run itself, so the two conditions agree again and
#     CI is the higher of the two figures rather than the lower.
#
# Reproduce both conditions together before regenerating any floor here:
#
#   docker network create covfloor-net-$$
#   docker run -d --rm --name covfloor-pg-$$ --network covfloor-net-$$ \
#     --network-alias postgres -e POSTGRES_PASSWORD=birdcage-ci \
#     --entrypoint sh postgres:17-alpine -c '
#       apk add --no-cache openssl >/dev/null
#       mkdir -p /certs
#       openssl req -new -x509 -days 1 -nodes -subj "/CN=postgres" \
#         -addext "subjectAltName=DNS:postgres" \
#         -keyout /certs/server.key -out /certs/server.crt
#       chown postgres:postgres /certs/server.crt /certs/server.key
#       chmod 600 /certs/server.key && chmod 644 /certs/server.crt
#       exec docker-entrypoint.sh postgres -c ssl=on \
#         -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key'
#   # poll `docker exec <name> pg_isready -U postgres`, not just the port --
#   # see test:go's own loop and its comment on why.
#
#   # BIRDCAGE_TEST_DATABASE_URL is sslmode=verify-full since #84 --
#   # birdcage now refuses anything weaker at start-up, and this floor's
#   # premise is matching test:go exactly, not a shape it would itself
#   # reject. sslrootcert is captured from the running server, the same
#   # way test:go's before_script does it: the certificate above is
#   # self-signed, so the leaf the server presents back over the wire IS
#   # the root verify-full is told to trust.
#   docker run --rm --network covfloor-net-$$ -v "$PWD":/work postgres:17-alpine sh -c '
#     apk add --no-cache openssl >/dev/null
#     openssl s_client -starttls postgres -connect postgres:5432 -showcerts </dev/null 2>/dev/null \
#       | openssl x509 -outform pem > /tmp/covfloor-ca.pem
#     cp /tmp/covfloor-ca.pem /work/covfloor-ca.pem'
#   docker run --rm --network covfloor-net-$$ \
#     -e BIRDCAGE_TEST_DATABASE_URL='postgres://postgres:birdcage-ci@postgres:5432/postgres?sslmode=verify-full&sslrootcert=/work/covfloor-ca.pem' \
#     -v "$PWD":/work -w /work golang:1.27 \
#     go test ./... -race -coverprofile=/work/coverage.out
#
# Read the per-package numbers straight off that `go test` output -- they
# match coverage-floor.py's own computation to one decimal place (see the
# script's docstring). Running this on the bare host as your own non-root uid
# reintroduces both mistakes at once.
#
# scripts/coverage-floor.py also fails on any package present in the coverage
# profile but missing from this file: a new package must get a floor added
# here as a reviewed change, not slip in unmeasured.
#
# Measured 2026-09-20 from `BIRDCAGE_TEST_DATABASE_URL=... go test ./...
# -race -coverprofile=...` run as root inside `golang:1.27` against a real
# postgres:17-alpine, matching test:go exactly, on this checkout (95f900b).

floors:
  # --- below the 70% band: known debt, tracked on issue #74 ---
  cmd/birdcage: 63           # 64.3% measured with -race, 2026-09-23 (#94:
                             # main() split into startup.go)
                             # Main binary; RouterOS/CrowdSec credential-wiring
                             # path is still largely untested.
  cmd/nightjar: 50           # 50.4% measured, 2026-09-22 (#108, slice 1
                             # commit 4). New binary: the scan loop's own
                             # branches (mount-check failure, a runScan Go
                             # error, the ok path) are driven directly via
                             # buildSnapshot's injected checkMounts/runScan
                             # functions, but main()'s own wiring and the
                             # real checkMounts/realScan implementations
                             # (which need a real container's
                             # /proc/self/mountinfo and a real grype binary)
                             # are not unit-testable and stay below the 70%
                             # band, same as the other two agent binaries.
  cmd/mockingbird: 65       # 66.0% measured (was 60, and the package had
                             # slipped to 59.9% under it -- pipeline 1405's
                             # test:go caught that). The SNMP and port-scan
                             # roads, the Intake status accessors and
                             # currentSelfReport gained tests rather than the
                             # floor being lowered. Measured with -race, as
                             # test:go runs it, and as a non-root uid.
                             # Set at 65 rather than 66 on purpose. This
                             # package needs neither Postgres nor root, so a
                             # workstation ought to agree with CI -- but
                             # pipeline 1409 read 65.9% where this host read
                             # 65.7%, because one test asked for a bind to
                             # fail on a privileged port and the runner's
                             # containers set ip_unprivileged_port_start=0, so
                             # it bound instead. That test no longer depends on
                             # the host (see snmp_test.go), and the figure is
                             # 66.0% here now. One point of slack still costs
                             # nothing and absorbs the next such difference
                             # rather than turning the build red over it.
                             # Still below the 70% band; the rest is main() and
                             # the detector branches that need CAP_NET_RAW.
  internal/db: 87           # 88.3% measured with -race and Postgres, 2026-09-23
                             # (#74). db.go's Engine.String, Rebind's quoted-
                             # literal branch, Open's "sqlite:" prefix, and
                             # Begin/Tx (commit and rollback both proved by
                             # after-the-fact row absence, not just a nil
                             # error) plus migrate.go's closed-DB, foreign-
                             # schema-shape and non-idempotent-reapply error
                             # paths gained tests rather than the floor being
                             # lowered. Remaining gaps (openSQLite/openPostgres
                             # error returns, MigrationNames' ReadDir error,
                             # applyMigration's ReadFile/BeginTx/insert/commit
                             # failures) are dead code under the current
                             # drivers: sql.Open never touches the network or
                             # disk for either (verified empirically, matching
                             # Open's own doc comment), and the embedded
                             # migration names always exist for a defined
                             # Engine, so nothing reaches them without fault
                             # injection this package doesn't have a seam for.

  # --- no test files at all: floor 0, listed rather than silently absent ---
  cmd/seed-story: 0         # dev-data seeding CLI, not shipped; no _test.go.
  cmd/e2e-live-hit: 0       # test-only helper: runs the real enrol ->
                             # provision -> push handshake so the dashboard
                             # smoke test has a live SSE event (#81). Not
                             # shipped; exercised by test:smoke, not go test.
  internal/db/dbtest: 0     # test-fixture helper used by other packages'
                             # tests; has no tests of its own.

  # --- inside or above the 70-85% band ---
  internal/agentkind: 100     # 100.0% measured, 2026-09-22 (#105). A closed
                              # enum and a lookup table: every value and both
                              # sides of Valid() are exercised by construction,
                              # so anything less than 100 here means a kind or
                              # a profile arrived without a test.
  internal/agent/approval: 87
  internal/agent/atomicfile: 70  # 70.6% measured, 2026-09-22 (#108, slice 1
                              # commit 1). Factored out of cmd/mockingbird's
                              # atomic.go so a second agent kind can import
                              # it; the uncovered remainder is os-level
                              # failure branches (temp-dir Chmod/Sync/Rename
                              # errors) exercised by cmd/mockingbird's own
                              # token_test.go, not duplicated here.
  internal/agent/client: 87
  internal/agent/enrol: 81
  internal/agent/enrolment: 88  # 88.4% measured, 2026-09-22 (#108, slice 1
                              # commit 1). Factored out of cmd/mockingbird's
                              # enrol.go so a second agent kind can import
                              # it rather than copy-pasting it; every
                              # EnsureEnrolled branch, the retry loop's two
                              # exits, writeState's partial-failure path and
                              # redactErr are covered.
  internal/agent/event: 85
  internal/agent/ledger: 95
  internal/agent/portscan: 71
  internal/agent/probe: 95
  internal/agent/queue: 88
  internal/agent/readiness: 98 # New package (#65): independently dials the
                             # ports opencanary.conf enables to tell a
                             # started module from one that never did,
                             # rather than trusting OpenCanary's own startup
                             # log, which cannot tell the two apart itself.
                             # 98.0% measured on this checkout; the only gap
                             # is a context-cancellation race in Check that
                             # is exercised but not always the branch hit.
  internal/agent/receiver: 95
  internal/agent/snmp: 82
  internal/agent/tailer: 77
  internal/api: 84
  internal/audit: 94
  internal/ca: 76
  internal/enrol: 80
  internal/hostmask: 96      # 96.9% measured, 2026-09-22 (#108, slice 1
                             # commit 4). The shared mask-list constant and
                             # its startup mount check (Check, ParseMountinfo)
                             # -- every branch is driven by fixture mountinfo
                             # content, no real container required.
  internal/history: 82
  internal/ingest: 82
  internal/logging: 91
  internal/mail: 90
  internal/mailbox: 86
  internal/opencanary: 100
  internal/scan: 100          # 100.0% measured, 2026-09-22 (#108, slice 1
                              # commit 2). The Grype subprocess wrapper and
                              # its failure classification -- every branch
                              # is driven by a recorded-fixture unit test
                              # (a real grype binary is never required).
  internal/selftest: 96
  internal/selftestsched: 86 # 87.4-89.7% measured with -race and Postgres, 2026-09-23 (#46 slice 1). New
                             # package this slice adds: the scheduled
                             # self-test's tick, deadline sweep and
                             # rotation-coupled mint hook, against sqlite and
                             # Postgres both. The 2-point spread is one
                             # error branch the Run-loop test reaches only
                             # when cancel() lands mid-tick; every other
                             # branch has a deterministic test.
  internal/startcheck: 88   # 88.9% measured (was floored at 86). #93's
                             # non-root fix made the permission-refusal tests
                             # actually run in CI, and this is the first CI
                             # figure that includes them: pipeline 1405's
                             # test:go, the run that proved that change. The
                             # floor was deliberately left at 86 until that
                             # measurement existed, because a number in this
                             # file may not come from a workstation.
  internal/store: 78
  internal/stream: 100
  internal/term: 100
  internal/tlsconfig: 82
  web: 77
