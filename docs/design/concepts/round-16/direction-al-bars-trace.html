<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birdcage · Bars, shimmer, sharp trace</title><link rel="stylesheet" href="door.css"></head>
<body class="al bx" data-glint="shimmer" data-state="signin">
<img id="shell" src="dashboard.jpg" alt="" aria-hidden="true">
<div class="screen">
<canvas id="bars" aria-hidden="true"></canvas>
<div class="stack">
  <div class="wm-box"><span class="wm">BIRD<em>CAGE</em></span></div>
  <form id="f-signin" novalidate>
    <label><span class="sr-only">Account</span><input id="username" placeholder="account" autocomplete="username" value="ada"></label>
    <label><span class="sr-only">Password</span><input id="password" type="password" placeholder="password" autocomplete="current-password"></label>
    <p class="error" id="err" role="alert" hidden>Incorrect account or password. <span>4 attempts left.</span></p>
    <button class="submit">Enter</button>
    <div class="divider"><span>or</span></div>
    <a class="sso" href="#">Sign in with SSO</a>
  </form>
  <form id="f-code" novalidate>
    <h1>Enter your code</h1>
    <p class="subtitle">Your password was right. Enter the current code from your authenticator app to finish signing in.</p>
    <label><span class="sr-only">Code</span><input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></label>
    <button class="submit">Continue</button>
    <button type="button" class="link">Use your passkey instead</button>
    <button type="button" class="link">Use a recovery code instead</button>
  </form>
</div>
</div>
<nav class="proto">AL · Bars, shimmer, sharp trace<a href="#" data-go="signin">1 sign in</a><a href="#" data-go="refused">2 refused</a><a href="#" data-go="code">3 code</a><a href="#" data-go="in">4 enter</a></nav>
<script src="door.js"></script><script src="bars.js"></script>
</body></html>
