# unbound.conf -- a DNS server that answers for e2e.invalid out of its
# own local data and refuses every other question. Each setting that
# keeps an open 1.26.1 advisory out of reach is marked with it; the
# Dockerfile header has the list and #80 has the recheck.
#
# entrypoint.sh writes /run/unbound/listen.conf (the container's own
# address and subnet) and scripts/e2e/mail-stack.sh writes
# /dns/dkim.conf (the published key) before unbound starts.
server:
	include: /run/unbound/listen.conf
	port: 53
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	# No DoT, DoH or DoQ listener (CVE-2026-80225, -82720, -78227):
	# every interface is plain port 53, and with no tls-service-key
	# and no tls-port/https-port/quic-port interface there is nothing
	# for one to start on.

	do-daemonize: no
	username: "unbound"
	chroot: ""
	directory: "/etc/unbound"
	use-syslog: no
	logfile: ""
	verbosity: 1
	# Every question is logged, so the journey can show birdcage's key
	# lookup really came here.
	log-queries: yes
	hide-identity: yes
	hide-version: yes

	# Iterator only: no validator (CVE-2026-81634), and no trust anchor
	# is configured for one to fetch.
	module-config: "iterator"
	# CVE-2026-77860.
	serve-expired: no

	# Only local data: e2e.invalid is answered from the lines below and
	# NXDOMAIN for any other name in it; every other name is refused
	# outright, so nothing is ever recursed to (CVE-2026-85501). No
	# auth-zone anywhere (CVE-2026-77955).
	local-zone: "." refuse
	local-zone: "e2e.invalid." static
	include: /dns/dkim.conf

remote-control:
	control-enable: no
