# dovecot.conf for the e2e-mail image (issue #80). Test-only, never
# shipped. Two jobs: IMAP over TLS on 993 for the one test account, and
# the SASL socket Postfix checks the same account's password through.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *
log_path = /dev/stderr

# TLS from the first byte on 993 and nothing in the clear: the plain
# imap listener is switched off below, so there is no STARTTLS path to
# get wrong. The certificate is the one Postfix serves.
ssl = required
ssl_server_cert_file = /etc/mail-tls/server.pem
ssl_server_key_file = /etc/mail-tls/server-key.pem

auth_mechanisms = plain

# entrypoint.sh writes this file at start, from the password the stack
# script handed it (or, in MAIL_MODE=reject-auth, deliberately not).
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb static {
}

# Maildirs are owned by the account Postfix's virtual(8) delivers as;
# entrypoint.sh writes its numeric uid and gid (whatever Alpine's
# postfix package made it) into this file at start, with
# first_valid_uid lowered to match -- Alpine makes it a system account,
# below Dovecot's default floor of 500.
!include /etc/dovecot/vmail.conf
mail_home = /var/mail/%{user}
mail_driver = maildir
mail_path = ~/Maildir

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
