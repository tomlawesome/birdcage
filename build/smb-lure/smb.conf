# Samba configuration template. The @@TOKEN@@ placeholders are filled in
# by the entrypoint at start-up; smbd reads the filled-in copy on tmpfs,
# never this file.
#
# The comments here are deliberately short. Everything about *why* this
# file is shaped the way it is -- the CVE classes each switch avoids, why
# the audited operation is `close` and not `open`, and why there is no
# syslog daemon -- is in README.md beside it, which is not copied into
# the image. Nothing inside the image explains what the image is for.

[global]
   workgroup = @@WORKGROUP@@
   netbios name = @@SERVER_NAME@@
   server string = @@SERVER_STRING@@
   server role = standalone

   # Guest access only. No account here has a password and there is no
   # password database to guess: an unknown user name becomes the guest
   # account rather than being refused.
   security = user
   map to guest = bad user
   guest account = nobody
   restrict anonymous = 0

   # SMB2 and up, both directions. SMB1 is not spoken at all.
   server min protocol = SMB2_02
   client min protocol = SMB2_02

   # 445 only: port 139 is NetBIOS over TCP, useful only alongside nmbd,
   # and nmbd is not run here.
   smb ports = 445

   # Nothing but file shares.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   dns proxy = no
   unix extensions = no
   follow symlinks = no
   wide links = no

   # A ceiling on forked children, under the container's own pid limit,
   # so a client opening connections in a loop is refused by Samba
   # rather than exhausting the container.
   max smbd processes = 50

   # Every path Samba writes to is a separate tmpfs mount in the run
   # command, named here so a missing mount fails at start rather than
   # writing into the read-only root filesystem.
   lock directory = /run/samba
   pid directory = /run/samba
   state directory = /var/lib/samba
   cache directory = /var/cache/samba
   private dir = /var/lib/samba/private

   # Logging. `full_audit:1` with everything else at 0 keeps this file to
   # audit lines plus whatever Samba itself treats as level 0, which is
   # the start-up banner and its panic message and little else.
   # `debug prefix timestamp` puts the timestamp on the message line:
   # without it every record is two lines, a header and an indented
   # message.
   logging = file
   log file = @@AUDIT_FILE@@
   max log size = 0
   log level = 0 full_audit:1
   debug prefix timestamp = yes
   debug pid = no
   debug uid = no

   # There is no configuration option here for core files: `dump core` was
   # removed from Samba and this version ignores it (it logs "Unknown
   # parameter" if you set it). The run command passes --ulimit core=0
   # instead, which is the layer that can still refuse them. Samba creates
   # an empty `cores` directory next to the log file either way.

   # File auditing. `close` is audited rather than `open`: on SMB2 an
   # open arrives as the openat/create_file operation, whose audit
   # message carries an extra "r"/"w" field ahead of the path, while a
   # close message is the path alone. Writing straight to the log file
   # rather than through syslog is what lets this container run without
   # a syslog daemon.
   #
   # The prefix is three fields and stops there. `%U` is whatever user
   # name the client asked for -- the client chooses it, so it can
   # contain the `|` separator itself. It is first for that reason: a
   # reader counting fields from the right can never have the share, the
   # operation or the path moved under it by what a visitor typed. Adding
   # `%m` (the client's own NetBIOS name, chosen by the client too) would
   # put a second such field in the middle and undo that, so it is left
   # out; the source address in `%I` is Samba's own.
   vfs objects = full_audit
   full_audit:prefix = %U|%I|%S
   full_audit:success = close
   full_audit:failure = none
   full_audit:syslog = no

# The shares. Their names are settable at start-up; the paths behind them
# are fixed, because what is on them is part of the image.

[@@SHARE_PUBLIC@@]
   comment = Shared documents
   path = /srv/shares/public
   guest ok = yes
   read only = yes
   browseable = yes

[@@SHARE_BACKUP@@]
   comment = Configuration backups
   path = /srv/shares/backup
   guest ok = yes
   read only = yes
   browseable = yes

[@@SHARE_SCANS@@]
   comment = Scanner output
   path = /srv/shares/scans
   guest ok = yes
   read only = yes
   browseable = yes
