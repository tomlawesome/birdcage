# smb.conf for the e2e-samba image (scripts/e2e/smb.sh, issue #78 journey
# 3). Never shipped anywhere near the product -- see build/e2e-samba's own
# comment and ADR-0008; this exists purely so CI can point a real
# smbclient at a real smbd and check what lands in the audit log.
#
# The [global] section, the vfs_full_audit line and its `prefix` template
# are the configuration OpenCanary's own wiki documents
# (https://github.com/thinkst/opencanary/wiki/Opencanary-and-Samba),
# adapted in two ways that were worked out by actually running this
# image, not guessed:
#
#   1. `full_audit:success = close` rather than `open`. Modern Samba logs
#      SMB2 file opens through the `openat`/`create_file` VFS operations,
#      whose audit message carries an extra flag field ("r"/"w") before
#      the path, which shifts opencanary/modules/samba.py's fixed-index
#      parse off by one -- the FILENAME field would read "r" or "w"
#      instead of the path. `close` fires on every file Samba served
#      (read or write) and its audit message is just the path, which is
#      the shape samba.py expects at field index 12.
#   2. `full_audit:syslog = no` was tried first and does not work at
#      all: with it, vfs_full_audit logs through Samba's own DEBUG()
#      call, which never carries the `smbd_audit:` tag samba.py's regex
#      requires -- that tag is added by syslog(3) using the ident this
#      module passes to openlog(), so it only ever appears when
#      full_audit actually goes through syslog. Hence rsyslog is present
#      in this image at all: full_audit talks to syslog(3) on
#      /dev/log, and rsyslog.conf routes facility local7 into the file
#      OpenCanary is told to watch.
[global]
   workgroup = WORKGROUP
   server string = e2e-samba
   netbios name = E2ESAMBA
   security = user
   map to guest = bad user
   usershare allow guests = yes
   server role = standalone
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes
   dns proxy = no
   log level = 1
   vfs objects = full_audit
   full_audit:prefix = %U|%I|%i|%m|%S|%L|%R|%a|%T|%D
   full_audit:success = close
   full_audit:failure = none
   full_audit:facility = local7
   full_audit:priority = notice

[share]
   comment = e2e-samba journey share
   path = /srv/share
   guest ok = yes
   read only = no
   browseable = yes
