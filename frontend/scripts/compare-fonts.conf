<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts for the pixel gates (compare:band, compare:below-band). The
  round-6 reference shots were rendered on a host whose fontconfig
  resolved the generic families to WenQuanYi Zen Hei (sans) and
  WenQuanYi Zen Hei Mono; Ubuntu's default order picks DejaVu instead
  and the night scene lands ~2.5% off, over the 2% gate. Installed by
  CI into ~/.config/fontconfig/fonts.conf after `playwright install
  (with deps)` has put fonts-wqy-zenhei on the runner. Rendering the
  gates with other fonts means regenerating the shots, not a wider gate.
-->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>WenQuanYi Zen Hei</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>WenQuanYi Zen Hei</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>WenQuanYi Zen Hei Mono</family></prefer></alias>
</fontconfig>
