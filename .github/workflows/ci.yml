name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Frontend check, test, pixel compare, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      # --with-deps installs the same fonts (fonts-wqy-zenhei,
      # fonts-liberation, ...) the round-6 reference shots under
      # docs/design/concepts/round-6/shots/ were rendered with, which is
      # what keeps compare:band/compare:below-band's pixel diff under
      # their 2% gate in CI.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pixel-compare the band (issue #37 acceptance)
        run: npm run compare:band

      - name: Pixel-compare below the band (issue #38 acceptance)
        run: npm run compare:below-band

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  go:
    name: Go build, vet, test, lint
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # Postgres is mandatory in v1 alongside SQLite (issue #7, ADR-0001):
    # every internal/db and internal/store test that touches a database
    # runs against both engines, so CI needs a real Postgres to test
    # against and not just the SQLite temp-file path. BIRDCAGE_TEST_DATABASE_URL
    # below is what tells those tests it's there (see
    # internal/db/dbtest); unset, they'd silently run SQLite-only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: birdcage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fills web/dist with the frontend/dist the node job built, so the
      # go:embed below picks up the real UI instead of just the
      # placeholder .gitkeep (see web/embed.go).
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/dist

      - name: Build
        run: go build ./...

      # go build ./... above never writes a binary to disk for multiple
      # main packages; the smoke step below needs a real one to start.
      - name: Build birdcage binary
        run: go build -o birdcage ./cmd/birdcage

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          BIRDCAGE_TEST_DATABASE_URL: postgres://postgres:birdcage-ci@localhost:5432/postgres?sslmode=disable
        run: go test ./... -race

      - name: Set up Node (for the Playwright smoke below)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frontend dependencies (for the Playwright smoke below)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # SQLite only -- Postgres at the preview bar is #7's concern.
      - name: Playwright smoke
        working-directory: frontend
        env:
          BIRDCAGE_BIN: ${{ github.workspace }}/birdcage
        run: npm run smoke

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # The latest prebuilt golangci-lint binary (v2.13.2) is built
          # with Go 1.26 and hard-errors on this module's `go 1.27.0`
          # directive, so install from source with the Go version from
          # go.mod instead of the prebuilt binary.
          install-mode: goinstall
