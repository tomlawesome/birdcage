name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build, vet, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # Postgres is mandatory in v1 alongside SQLite (issue #7, ADR-0001):
    # every internal/db and internal/store test that touches a database
    # runs against both engines, so CI needs a real Postgres to test
    # against and not just the SQLite temp-file path. BIRDCAGE_TEST_DATABASE_URL
    # below is what tells those tests it's there (see
    # internal/db/dbtest); unset, they'd silently run SQLite-only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: birdcage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          BIRDCAGE_TEST_DATABASE_URL: postgres://postgres:birdcage-ci@localhost:5432/postgres?sslmode=disable
        run: go test ./... -race

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # The latest prebuilt golangci-lint binary (v2.13.2) is built
          # with Go 1.26 and hard-errors on this module's `go 1.27.0`
          # directive, so install from source with the Go version from
          # go.mod instead of the prebuilt binary.
          install-mode: goinstall
