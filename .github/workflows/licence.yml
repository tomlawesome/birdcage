name: Licence

# Gates the licences of the Go modules linked into the Birdcage binary
# (supply-chain/licence-policy.yml, scripts/licence-check.sh). Replaces
# the licence half of the old dependency-review-action check, which
# compared a PR diff via ClearlyDefined; go-licenses instead reads each
# module's actual LICENSE file, and is not limited to a PR diff, so it
# also runs on push to the long-lived branches.

on:
  pull_request:
  push:
    branches:
      - main
      - preview
      - dev

concurrency:
  group: licence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  licence-check:
    name: Shipped dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check shipped dependency licences
        run: scripts/licence-check.sh
