name: CodeQL

on:
  push:
    branches:
      - main
      - preview
      - dev
  pull_request:
    branches:
      - main
      - preview
      - dev
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Birdcage is documentation and workflows only at this point, so
        # `actions` is the sole language with anything to analyze. The
        # backend is Go (ADR-0001), and CodeQL fails outright on a language
        # whose sources it cannot find -- so the Go entry stays commented
        # out until the first Go file lands, at which point uncomment it,
        # let it report once, and add `CodeQL (go)` to the required checks
        # on dev, preview, main and hotfix/**.
        include:
          # The Actions extractor only supports build-mode: none -- there
          # is nothing to compile. Go is compiled and needs autobuild.
          - language: actions
            build-mode: none
          # - language: go
          #   build-mode: autobuild

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
