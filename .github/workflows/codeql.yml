name: CodeQL

on:
  push:
    branches:
      - main
      - preview
      - dev
  pull_request:
    branches:
      - main
      - preview
      - dev
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: "-mod=readonly"
  # gauntlet is fetched from its Git host, never through proxy.golang.org
  # or sum.golang.org: the first lookup there records a version for good,
  # which is publishing it (ADR-0016 decision 1). GOPRIVATE turns both off
  # for the owner's modules; go.sum still pins the exact content. The Go
  # autobuild below runs `go build`, so it needs the same two values as
  # .gitlab-ci.yml.
  GOPRIVATE: "github.com/tomlawesome/*"

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Actions extractor only supports build-mode: none -- there
          # is nothing to compile. Go is compiled and needs autobuild.
          # The first Go source has landed (ADR-0001), so the Go entry is
          # live. Once `CodeQL (go)` has reported at least once on dev,
          # add it to the required checks on dev, preview, main and
          # hotfix/** -- requiring a context that has never reported
          # blocks every PR permanently.
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
