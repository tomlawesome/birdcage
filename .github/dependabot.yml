version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Target the integration branch explicitly rather than inheriting the
    # repository default, so updates keep following dev -> preview -> main
    # even if the default branch changes.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # No gomod entry: go.mod requires github.com/tomlawesome/gauntlet, which
  # must never be looked up through proxy.golang.org or sum.golang.org
  # (ADR-0016 decision 1; the first lookup records the version for good).
  # Go updates pause here until Renovate on GitLab takes them over (#186).
  # Owner, 2026-10-10, on #8 (answer 5a).
