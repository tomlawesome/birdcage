# GitLab is where birdcage is developed: branches, merge requests and the
# dev -> preview -> main promotions all happen here, and this file is the
# CI that gates them. GitHub is a read-only mirror of those three branches
# (the `sync` stage pushes each one after a merge) and keeps CodeQL and
# dependency review. The general model is in the gitlab-first-migration
# skill; the jobs below carry what GitHub's ci.yml, licence.yml and
# branch-policy.yml used to (all three retired once this file was green).
#
# The `sync` stage reads MIRROR_TO_GITHUB and GITHUB_MIRROR_SSH_KEY, both
# protected project CI/CD variables the owner set on 2026-09-13. Nothing
# here sets them, and it fires only on a push pipeline for one of the three
# branches -- in practice, the push a merge makes.
#
# Runner lanes (ai/agent-infra#3): `big` is 8 CPU / 18 GB, `light` is
# 4 CPU / 6 GB. A job with no matching tag does not run at all.

stages:
  - lint
  - test
  - e2e
  - release
  - sync

default:
  tags: [light]
  interruptible: true

variables:
  GOFLAGS: "-mod=readonly"
  # Where the six images are published (#90, #125, #126, #132).
  # Deliberately NOT named BIRDCAGE_IMAGE: that is the environment
  # variable scripts/verify-validation-evidence.sh reads to know which
  # repository it is judging, and a pipeline-wide value of that name
  # would be inherited by every verifier call -- including the one
  # checking the *other* image, which would then verify the wrong
  # repository and still pass.
  BIRDCAGE_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/birdcage
  MOCKINGBIRD_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/mockingbird
  NIGHTJAR_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/nightjar
  SMB_LURE_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/smb-lure
  HOLDER_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/holder
  OPENCANARY_RELEASE_REPO: ${CI_REGISTRY_IMAGE}/opencanary
  # Where the same digests are mirrored, read-only, for the public (#90,
  # note 22233): GitLab is where a release is published and promoted --
  # the evidence is bound to the digest here -- and GHCR is only ever a
  # copy of a digest that already cleared that bar, never a second place
  # to publish from.
  BIRDCAGE_MIRROR_REPO: ghcr.io/tomlawesome/birdcage
  MOCKINGBIRD_MIRROR_REPO: ghcr.io/tomlawesome/mockingbird
  NIGHTJAR_MIRROR_REPO: ghcr.io/tomlawesome/nightjar
  SMB_LURE_MIRROR_REPO: ghcr.io/tomlawesome/smb-lure
  HOLDER_MIRROR_REPO: ghcr.io/tomlawesome/holder
  OPENCANARY_MIRROR_REPO: ghcr.io/tomlawesome/opencanary
  # Docker Hub images the pipeline pulls repeatedly, routed through GitLab's
  # group dependency proxy (refs #128): Docker Hub's anonymous-pull limit
  # was failing e2e and test:go before they ever ran. Same bytes, cached on
  # the GitLab server instead of re-crossing the WAN every job. `library/`
  # is Docker Hub's own namespace for an official, unprefixed image.
  # Job `image:`/`services:` pulls are authenticated to the proxy by the
  # runner automatically; a job that pulls one of these on its own account
  # inside its script (docker run/build/pull against its own daemon) still
  # needs its own `docker login` first -- see the jobs that do. Versions
  # unchanged from before this issue; only the source moved.
  GOLANG_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/golang:1.27
  NODE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/node:26-trixie
  PYTHON_ALPINE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/python:3.14-alpine
  # Pinned to the OpenCanary image's own base (build/opencanary/Dockerfile),
  # not the newest Python: lint:licences-python audits the pip packages
  # exactly as that image installs them, and zope.interface==7.2 (pinned by
  # build/opencanary/requirements.txt) has no 3.14 wheel yet.
  PYTHON_SLIM_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/python:3.13-slim-trixie
  ALPINE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:3.24
  DOCKER_CLI_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/docker:29-cli
  # Postgres 18 everywhere (owner, 2026-09-27, #140 decision 2b): this is
  # now the one Postgres pin in this file, used by both test:go's service
  # and scripts/e2e/stack.sh's own TLS-enabled image below -- kept as two
  # separate call sites (one env var, one script default) rather than
  # unified, so a future major-version bump is one line here.
  POSTGRES18_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/postgres:18-alpine
  # build/e2e-samba and build/e2e-snmp are CI-only fixture images (never
  # shipped), built during the e2e stage.
  DEBIAN_TRIXIE_SLIM_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/debian:trixie-slim
  # What the release jobs install on $DOCKER_CLI_IMAGE (.registry_login),
  # and what test:release-scripts installs to run their tests there.
  # python3: scripts/verify-validation-evidence.sh judges evidence in it.
  RELEASE_APK_PACKAGES: bash curl python3

.gate: &gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "preview"
    - if: $CI_COMMIT_BRANCH == "main"

# The higher bar (#91, docs/ci-hops.md): extra jobs, run only when entering
# and sitting on `preview` and `main`, where a Postgres-only regression is
# worth catching before -- and after -- the promotion lands. Nothing here
# replaces the gate above, and nothing was moved out of it; the gate's own
# jobs still run at these hops too, because `*gate` names them as well.
.higher_bar: &higher_bar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
    - if: $CI_COMMIT_BRANCH == "preview"
    - if: $CI_COMMIT_BRANCH == "main"

.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# ---------------------------------------------------------------------------
# POLICY -- the promotion order. This is the gate GitHub's branch-policy.yml
# used to be. Bites only if the project requires a passing pipeline to
# merge; otherwise a warning.
# ---------------------------------------------------------------------------
policy:promotion-hop:
  stage: lint
  image: $ALPINE_IMAGE
  needs: []
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  script:
    - 'echo "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        main)
          [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "preview" ] || { echo "main only accepts merge requests from preview"; exit 1; }
          ;;
        preview)
          # A hotfix/<name> branch cut from preview carries a fix that cannot
          # wait for an audit of dev's newer work (#89, owner 2026-10-02).
          # The name is bounded as orbit's stable-promotion-policy.mjs does.
          case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
            dev) ;;
            hotfix/*)
              printf '%s\n' "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eqx 'hotfix/[A-Za-z0-9._-]+' || { echo "hotfix branch name must be hotfix/<name> using A-Z a-z 0-9 . _ -"; exit 1; }
              ;;
            *) echo "preview only accepts merge requests from dev or hotfix/<name>"; exit 1 ;;
          esac
          ;;
      esac

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
lint:go:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  script:
    - go build ./...
    - go vet ./...
    - |
      files=$(git ls-files '*.go')
      [ -n "$files" ] || { echo "git ls-files returned no Go files"; exit 1; }
      unformatted=$(gofmt -l $files)
      [ -z "$unformatted" ] || { echo "Not gofmt-clean:"; echo "$unformatted"; gofmt -d $files; exit 1; }
    # Built from source with the image's Go: the prebuilt binary is built
    # with an older Go and refuses go.mod's `go 1.27.1` directive.
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    - golangci-lint run ./...

# Ported from licence.yml; the script is host independent by design.
lint:licences:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  script:
    - scripts/licence-check.sh

# The pip counterpart (#95): before this, nothing gated the Python
# packages installed into the mockingbird image at all. python:3.13-slim-
# trixie, not a generic Python image, because that is exactly the base
# build/mockingbird/Dockerfile's honeypot stage installs onto, so what
# this job sees is what actually ships. Its own tests are
# scripts/licence-check-python.test.sh, run here too, same reasoning as
# lint:ci's guard tests.
# No *git_safe here, unlike lint:licences above: that anchor's
# before_script runs `git config`, and this image has no git in it at all
# (pipeline 1421 failed with "git: command not found", exit 127). The job
# does not need git either -- the runner's helper image does the checkout,
# and neither the gate nor its tests shell out to git. lint:ci is the same
# shape for the same reason, on a python image with *gate alone.
lint:licences-python:
  stage: lint
  image: $PYTHON_SLIM_IMAGE
  <<: *gate
  script:
    - scripts/licence-check-python.test.sh
    - scripts/licence-check-python.sh

# The agent ships in the Mockingbird container, on the machine the product
# expects to be attacked. No birdcage server package may reach it --
# ADR-0008 decision 4.
# ---------------------------------------------------------------------------
# The live checks in AGENTS.md ("Live testing is not optional") are only
# worth having if they cannot be quietly switched off. This job is that
# rule as a red pipeline: it refuses an e2e stage that is missing, empty,
# allowed to fail, manual, or ruled out of merge requests. Its own tests
# are scripts/ci-e2e-guard.test.sh, run here too -- a guard nobody tests
# guards nothing.
# ---------------------------------------------------------------------------
lint:ci:
  stage: lint
  image: $PYTHON_ALPINE_IMAGE
  <<: *gate
  needs: []
  before_script:
    - apk add --no-cache bash >/dev/null
    - pip install --quiet pyyaml
  script:
    - python3 scripts/ci-e2e-guard.py
    - scripts/ci-e2e-guard.test.sh
    # The same idea for the release stage (#90): the split that keeps one
    # job from both judging an artefact and shipping it is prose until
    # something fails red when it is undone.
    - python3 scripts/ci-release-guard.py
    - scripts/ci-release-guard.test.sh
    # Every `uses:` pin in .github/workflows/*.yml is recorded, reviewed
    # and matches its inline version comment (#27). supply-chain/action-pins.json
    # is the record; this is the check that it is still true.
    - python3 scripts/action-pins-check.py
    - scripts/action-pins-check.test.sh

# ---------------------------------------------------------------------------
# Every scripts/*.test.sh, in one job (#100). Before this, three of the
# thirteen suites ran anywhere: the two guard suites in lint:ci and the pip
# licence suite in lint:licences-python. The other ten tested scripts in the
# release path -- the part of this repository with the least other coverage,
# none of which has ever run against a real registry -- and nothing ran them.
#
# The loop is deliberate. A list would have to be edited every time a suite
# is added, and the ten that were missing are exactly what happens when
# somebody forgets. A new scripts/*.test.sh is gated the moment it lands.
#
# The suites are hermetic: the ones that would otherwise need docker, cosign
# or a registry source their script and replace the daemon-touching
# functions with fixtures, so this needs nothing but bash and python3. The
# two checks that do need more -- a Postgres for the coverage floors, an
# installed frontend/node_modules for the npm licences -- say so and skip
# here, and run for real in test:go and frontend, which have them.
# ---------------------------------------------------------------------------
lint:scripts:
  stage: lint
  image: $PYTHON_ALPINE_IMAGE
  <<: *gate
  needs: []
  before_script:
    # curl is not padding: ensure-cosign.sh downloads with it, and its suite
    # drives that path against a file:// fixture. Without curl the suite goes
    # red with four "curl: command not found" -- which this job found by
    # being run in this image before it was committed, on a workstation
    # where curl happens to exist.
    # git: scripts/release-candidate.test.sh builds merge shapes in a
    # scratch repository.
    - apk add --no-cache bash curl git >/dev/null
    - pip install --quiet pyyaml
  script:
    - |
      set -eu
      found=0
      failed=""
      for suite in scripts/*.test.sh; do
        found=$((found + 1))
        echo "--- $suite"
        if bash "$suite"; then :; else failed="$failed $suite"; fi
      done
      [ "$found" -gt 0 ] || { echo "no scripts/*.test.sh found at all"; exit 1; }
      if [ -n "$failed" ]; then
        echo "failed suites:$failed"
        exit 1
      fi
      echo "all $found script suites passed"

# The release scripts' own tests, run on the image the release jobs use,
# with exactly the packages they install (RELEASE_APK_PACKAGES). lint:scripts
# runs every suite on a Python image, which is how #158 slipped through:
# the scripts passed there and then met no python3 at release:preview.
# git is for release-candidate.test.sh's scratch repository; release:promote
# installs it itself. A new release script's test belongs in this list.
test:release-scripts:
  stage: lint
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs: []
  before_script:
    - apk add --no-cache $RELEASE_APK_PACKAGES git >/dev/null
  script:
    - |
      set -eu
      failed=""
      for suite in \
        scripts/verify-validation-evidence.test.sh \
        scripts/publish-channel.test.sh \
        scripts/promote-release.test.sh \
        scripts/publish-image.test.sh \
        scripts/attest-tested-image.test.sh \
        scripts/mirror-image.test.sh \
        scripts/release-version.test.sh \
        scripts/release-candidate.test.sh \
        scripts/image-tag-policy.test.sh \
        scripts/policy-version.test.sh \
        scripts/ci-ensure-image.test.sh \
        scripts/ensure-cosign.test.sh; do
        echo "--- $suite"
        if bash "$suite"; then :; else failed="$failed $suite"; fi
      done
      if [ -n "$failed" ]; then
        echo "failed on the release image:$failed"
        exit 1
      fi

lint:agent-deps:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  script:
    # Once per agent binary (ADR-0009 decision 6) -- each kind's own
    # allowed set, checked separately so one kind's fence cannot cover
    # for a hole in the other's.
    - scripts/agent-deps-check.sh ./cmd/mockingbird
    - scripts/agent-deps-check.sh ./cmd/nightjar

# govulncheck (#51, owner approval 2026-09-27): golang.org/x/vuln is a
# CI-only tool, never linked into birdcage (AGENTS.md, "Approved third-
# party modules"). Installed from source and run against this project's
# own `go 1.27.1` (go.mod) -- the Go checksum database verifies the
# module download the same way it does for golangci-lint above.
#
# GOTOOLCHAIN=local on both steps, deliberately: golang.org/x/vuln's own
# go.mod names a lower floor than 1.27.1, and GOTOOLCHAIN=auto's default
# module-aware toolchain selection picks a toolchain that satisfies
# *that* floor, not this project's -- observed directly: it built
# govulncheck with go1.26.8, which then refused to analyse this
# project's go1.27-only source ("package requires newer Go version
# go1.27") on every commit, clean or not. GOTOOLCHAIN=local pins both
# steps to $GOLANG_IMAGE's own go, which already satisfies govulncheck's
# floor and matches go.mod exactly -- confirmed against the real
# golang:1.27 image.
#
# A reachable vulnerability fails the job; an unreachable one is printed
# only -- govulncheck's own default. Proved locally, not assumed: a
# throwaway module pinning golang.org/x/text@v0.3.6 and calling
# language.Parse (GO-2021-0113, a known reachable out-of-bounds read)
# exits 3; this project's own tree, run the same way, exits 0.
lint:govulncheck:
  stage: lint
  image: $GOLANG_IMAGE
  <<: *gate
  script:
    - GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - GOTOOLCHAIN=local govulncheck ./...

# gitleaks (#28, owner approval 2026-09-27): the released MIT binary, not
# the commercially-licensed gitleaks-action -- scripts/ensure-gitleaks.sh
# installs it from a checksum-verified release, the same shape as
# scripts/ensure-cosign.sh. CI-only, never linked or shipped.
#
# GIT_DEPTH: 0 overrides the project's default shallow clone so full
# history is actually there to scan (acceptance criterion 1); a shallow
# checkout would make this job pass on a repository it never really
# looked at. scripts/gitleaks-scan.sh is the one place the scan command
# itself is written (--redact, criteria 3/4) so this job and its own
# test run the identical invocation.
#
# The self-test runs before the real scan, in the same job: it proves the
# gate can fail (criterion 2, a planted secret) using the gitleaks this
# job just installed, rather than assuming a check that never ran red
# actually gates anything.
lint:gitleaks:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  variables:
    GIT_DEPTH: 0
  before_script:
    # $GOLANG_IMAGE (Debian) already ships git, bash, curl, openssl and
    # tar -- everything ensure-gitleaks.sh and the self-test need. Only
    # gitleaks itself is missing.
    - scripts/ensure-gitleaks.sh /usr/local/bin
  script:
    - scripts/gitleaks-scan.test.sh
    - scripts/gitleaks-scan.sh .

# #139: nothing else in this file ever checks a pin against its own
# upstream -- every version above is trusted to still be current for as
# long as nobody happens to look. scripts/staleness-check.py is that
# look: every Go module, npm package, pip package, container tag, apk
# pin and checksum-pinned tool this file and the Dockerfiles name,
# compared against its real registry. Never on a merge request or on
# push to dev -- a check that only reads the outside world has nothing to
# do with the change in front of it, would make every pipeline pay for a
# round trip to half a dozen registries, and would go red for a reason
# nobody in the merge request can fix by editing their own diff. A
# pipeline schedule whose description is exactly `staleness` is what
# runs it (schedule 14, weekly on `dev`; GitLab exposes the description
# as $CI_PIPELINE_SCHEDULE_DESCRIPTION, so no schedule variable has to
# be set by hand -- the endpoint for those is owner-only, #139); the
# `when: never` fallback keeps every other trigger, including an
# unrelated schedule, from running it by accident. `scripts/ci-e2e-
# guard.py` carries the matching rule (docs/ci-hops.md's own guard,
# extended by this issue): any `audit:`-prefixed job must be
# schedule-only and outside the `e2e` stage, so this arrangement cannot
# quietly grow a second copy that runs on every branch.
audit:staleness:
  stage: lint
  image: $PYTHON_ALPINE_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "staleness"
    - when: never
  before_script:
    - pip install --quiet pyyaml
  script:
    - python3 scripts/staleness-check.py --report staleness-report.md
  artifacts:
    paths: [staleness-report.md]
    when: always
    expire_in: 90 days

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

# Frontend: type-check, unit tests, the two pixel gates against the
# round-6 concept shots, then the production build the Go binary embeds.
# The fonts.conf makes the generic font families resolve to what the
# reference shots were rendered with (frontend/scripts/compare-fonts.conf
# explains; GitHub run 34747740616 is what happens without it).
test:frontend:
  stage: test
  image: $NODE_IMAGE
  <<: *gate
  # This job needs nothing any lint job produces, but with no needs: key
  # it waited for the whole lint stage anyway before starting, and
  # test:smoke then waited on its artifacts in turn -- the longest chain
  # in the pipeline, scheduled to start last. No saving is claimed for
  # this: the runner is shared with every other project on this host and
  # wall clock for the same gate ranges from 263 to 1620 seconds, so one
  # pipeline cannot show the effect. See docs/ci-hops.md, which explains
  # why quoting a figure from a single run is a mistake. The dependency
  # was simply never real.
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    # Licence gate for the npm tree (#92). It lives here, rather than in
    # lint:licences with its Go counterpart, because it needs an
    # installed node_modules and this is the only job that has one --
    # a separate job would pay a second `npm ci` on every merge request
    # to check the same tree. It runs before the tests so a licence
    # problem is reported without waiting for them. node:26-trixie ships
    # python3 (3.13.5, verified), which the checker needs.
    - ../scripts/licence-check-npm.sh
    - npm run check
    # Coverage, not a bare test run (#74). The thresholds in
    # vitest.config.ts are a ratchet at today's numbers, so this fails if
    # coverage falls. Proved to fail: forcing the branch threshold to 95
    # exits 1 with "Coverage for branches (60.41%) does not meet global
    # threshold".
    - npm run test:coverage
    # The smoke journey's own helpers: its port allocator (#159) and its
    # DATABASE_URL guard. Neither needs Go, a built binary or a browser,
    # and before this nothing ran them.
    - npm run test:e2e-helpers
    - npx playwright install --with-deps chromium
    - mkdir -p ~/.config/fontconfig && cp scripts/compare-fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f
    - fc-match sans-serif && fc-match monospace
    - npm run compare:band
    - npm run compare:below-band
    # Issue #118's canary page, gated the same way the band is: the four
    # round-7 scenes against references captured from the build.
    - npm run compare:canary
    - npm run build
  # Surfaces the total in the job list, and feeds GitLab the per-line
  # cobertura report so coverage shows on the merge request diff rather
  # than only in this log.
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    paths:
      - frontend/dist/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 1 day
    when: always

# Go tests against SQLite and a real Postgres (issue #7, ADR-0001):
# BIRDCAGE_TEST_DATABASE_URL is what tells internal/db/dbtest the
# Postgres is there; unset, those tests silently run SQLite-only.
#
# TLS since #84 (birdcage now refuses a weaker DATABASE_URL at
# start-up -- internal/startcheck, not exercised by this job, but
# BIRDCAGE_TEST_DATABASE_URL should not model a shape birdcage itself
# refuses). The service's entrypoint is overridden to generate a
# throwaway certificate before handing over to the stock entrypoint --
# ported from mikroview's test:postgres job, which solved the same
# problem first, the same way: no image build and no Docker inside this
# job, since `services:` cannot build one.
#
# verify-full, not mikroview's require: this needs the actual chain, so
# `before_script` below captures the certificate the server presents
# over the network with openssl s_client and hands it to psql/pgx as
# sslrootcert -- the certificate is its own CA (self-signed), so the
# leaf the server sent back IS the root verify-full is told to trust.
test:go:
  stage: test
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  needs: []
  services:
    - name: $POSTGRES18_IMAGE
      alias: postgres
      entrypoint: ["sh", "-c"]
      command:
        - |
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=postgres" \
            -addext "subjectAltName=DNS:postgres" \
            -keyout /certs/server.key -out /certs/server.crt
          chown postgres:postgres /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          exec docker-entrypoint.sh postgres -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
  variables:
    POSTGRES_PASSWORD: birdcage-ci
    BIRDCAGE_TEST_DATABASE_URL: postgres://postgres:birdcage-ci@postgres:5432/postgres?sslmode=verify-full&sslrootcert=/tmp/postgres-ca.pem
  script:
    # The runner only waits for the port, and Postgres listens briefly
    # during its own init before restarting; ask the server itself.
    - apt-get -qq update && apt-get -qq install -y postgresql-client openssl >/dev/null
    - |
      ready=0
      for attempt in $(seq 1 40); do
        pg_isready -h postgres -U postgres >/dev/null 2>&1 && { ready=1; break; }
        sleep 1
      done
      [ "$ready" = 1 ] || { echo "postgres never became ready"; exit 1; }
    # BIRDCAGE_TEST_DATABASE_URL's sslrootcert names this exact path --
    # captured now, from the running server, rather than shared from the
    # service container, which no volume or filesystem connects this
    # job container to.
    - |
      openssl s_client -starttls postgres -connect postgres:5432 -showcerts </dev/null 2>/dev/null \
        | openssl x509 -outform pem > /tmp/postgres-ca.pem
      [ -s /tmp/postgres-ca.pem ] || { echo "could not capture the postgres server certificate"; exit 1; }
    # -coverprofile alongside -race so one run does both (#74). The
    # floors in supply-chain/coverage-floors.yml are a ratchet at
    # measured values, not the owner's 70-85% band: a threshold set at
    # the band would be red on code nobody touched.
    #
    # Go reports statement coverage, and that already catches an untaken
    # branch: a body that never runs is uncovered statements. What it
    # cannot see is a compound condition. `if a && b` reaches 100% having
    # only ever run (true,true) and (false,true) -- b was never decisive
    # and nothing says so. Demonstrated, not assumed. So the branch floor
    # in the owner's policy is set on the frontend, where vitest reports
    # branches; here the floor is on statements.
    #
    # This run sets BIRDCAGE_TEST_DATABASE_URL, so internal/db is
    # measured against real Postgres here and reads higher than it does
    # on a workstation, where the same tests fall back to SQLite.
    # golang:1.27 ships python3 (3.13.5, verified), which the checker
    # needs.
    # #93: run the suite as a NON-ROOT user. internal/startcheck proves
    # birdcage refuses to start on unsafe file permissions, and those
    # tests skip themselves as uid 0 -- correctly, because root ignores
    # the mode bits they set, so the refusal would "pass" without ever
    # being exercised. This image runs as root, so until now those two
    # tests ran only on whoever happened to run the suite locally. A
    # check that looks enforced and is not is the thing AGENTS.md's live
    # testing rule exists to prevent.
    #
    # Root is still needed for the setup above -- apt-get, and capturing
    # the server certificate -- so only the test run drops privileges.
    # The caches go to a tester-owned directory rather than the image's
    # root-owned /go/pkg/mod, because `go test` writes a lock there when
    # it resolves modules and would fail as a non-root user. Downloading
    # the modules again costs seconds and go.sum still verifies them.
    - |
      set -eu
      useradd --create-home --uid 1001 tester
      install -d -o tester -g tester /tmp/gotest
      # tester has to read the certificate the URL below names.
      chmod 0644 /tmp/postgres-ca.pem
    # -timeout=20m: room above internal/store's ~100s post-#138 runtime
    # (was ~500-550s, hitting go test's 10m per-package default under a
    # busy runner) plus every other package, so a genuinely hung test
    # still fails the job instead of running forever.
    - >-
      su tester -c "cd '$CI_PROJECT_DIR' &&
      HOME=/home/tester
      GOCACHE=/tmp/gotest/cache
      GOMODCACHE=/tmp/gotest/mod
      GOFLAGS='$GOFLAGS'
      BIRDCAGE_TEST_DATABASE_URL='$BIRDCAGE_TEST_DATABASE_URL'
      go test ./... -race -timeout=20m -coverprofile=/tmp/gotest/coverage.out"
    # Read back as root: the profile is tester-owned but world-readable,
    # and nothing below writes to it.
    - go tool cover -func=/tmp/gotest/coverage.out | tail -1
    - python3 scripts/coverage-floor.py /tmp/gotest/coverage.out

# The real binary, with the frontend build embedded, seeded from the
# night fixture and driven by Playwright (frontend/e2e/smoke.mjs). Node
# image plus the Go tarball pinned to go.mod's version, since both are
# needed in one job. SQLite only -- Postgres at the preview bar is #7's.
#
# Firefox (#83, AGENTS.md "Browser journeys run in Firefox"): the owner
# browses on Firefox, so that is the bar every change has to clear. The
# engine is resolved once, by frontend/e2e/browser.mjs -- BIRDCAGE_BROWSER
# below is set explicitly rather than relying on that module's default, so
# the browser this job runs is visible here rather than only in the script
# it calls.
test:smoke:
  stage: test
  image: $NODE_IMAGE
  <<: [*gate, *git_safe]
  needs:
    - job: test:frontend
      artifacts: true
  variables:
    BIRDCAGE_BROWSER: firefox
  script:
    - scripts/ensure-go.sh
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - rm -rf web/dist && cp -r frontend/dist web/dist
    - go build -o birdcage ./cmd/birdcage
    - cd frontend
    - npm ci
    - npx playwright install --with-deps firefox
    - BIRDCAGE_BIN="$CI_PROJECT_DIR/birdcage" npm run smoke

