# The same journeys again (#81), against Postgres instead of a fresh
# SQLite file, at the same hop docs/ci-hops.md already puts every other
# journey's Postgres variant (e2e:smb:postgres and its neighbours,
# "Hop 2"): storage-engine differences show up in how the seeded story
# is written and read back, not in what a browser does, so this is worth
# a release pipeline and not worth every branch -- Firefox alone stays
# the bar every change has to clear. DATABASE_URL is frontend/e2e/smoke.mjs's
# own switch (unset there is SQLite, exactly as #39 left it); it must
# already carry sslmode=verify-full, since internal/startcheck.PostgresRequiresVerifyFull
# refuses anything weaker before birdcage's first listener binds. The
# Postgres-with-TLS service block below is test:go's own, verbatim --
# same throwaway certificate, same reason (services: cannot build an
# image, so the stock entrypoint is overridden to mint one before
# handing back to it).
test:smoke:postgres:
  stage: test
  image: $NODE_IMAGE
  <<: [*higher_bar, *git_safe]
  needs:
    - job: test:frontend
      artifacts: true
  services:
    - name: $POSTGRES18_IMAGE
      alias: postgres
      entrypoint: ["sh", "-c"]
      command:
        - |
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=postgres" \
            -addext "subjectAltName=DNS:postgres" \
            -keyout /certs/server.key -out /certs/server.crt
          chown postgres:postgres /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          exec docker-entrypoint.sh postgres -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
  variables:
    POSTGRES_PASSWORD: birdcage-ci
    BIRDCAGE_BROWSER: firefox
  script:
    - scripts/ensure-go.sh
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - rm -rf web/dist && cp -r frontend/dist web/dist
    - go build -o birdcage ./cmd/birdcage
    # The runner only waits for the port, and Postgres listens briefly
    # during its own init before restarting; ask the server itself --
    # same wait as test:go's own.
    - apt-get -qq update && apt-get -qq install -y postgresql-client openssl >/dev/null
    - |
      ready=0
      for attempt in $(seq 1 40); do
        pg_isready -h postgres -U postgres >/dev/null 2>&1 && { ready=1; break; }
        sleep 1
      done
      [ "$ready" = 1 ] || { echo "postgres never became ready"; exit 1; }
    # sslrootcert names this exact path -- captured now, from the running
    # server, rather than shared from the service container, which no
    # volume or filesystem connects this job container to.
    - |
      openssl s_client -starttls postgres -connect postgres:5432 -showcerts </dev/null 2>/dev/null \
        | openssl x509 -outform pem > /tmp/postgres-ca.pem
      [ -s /tmp/postgres-ca.pem ] || { echo "could not capture the postgres server certificate"; exit 1; }
    - export DATABASE_URL="postgres://postgres:birdcage-ci@postgres:5432/postgres?sslmode=verify-full&sslrootcert=/tmp/postgres-ca.pem"
    - export SMOKE_DATABASE_URL_IS_DISPOSABLE=1 # this job's own throwaway Postgres service, torn down with it
    - cd frontend
    - npm ci
    - npx playwright install --with-deps firefox
    - BIRDCAGE_BIN="$CI_PROJECT_DIR/birdcage" npm run smoke

# The two shipped images (#69), built and run as validation only -- nothing
# here pushes to a registry; publishing is a separate job with its own
# credentials (git-and-delivery skill, "Validation and publication are
# separate jobs"). Same shape as mikroview's test:container: the runner
# host's rootless Docker socket, names carrying $CI_JOB_ID so parallel
# pipelines never collide, and probes over --network container: rather
# than --publish, which would race other jobs for host ports.
# ---------------------------------------------------------------------------
# The images are built ONCE, here, and every later job uses those exact
# bytes (#90). Before this job existed, `test:image:birdcage` built its own
# copy and threw it away, so nothing that was tested could ever be the thing
# that shipped -- a release would have pushed a second build of the same
# source and called it validated. Now the image that answers the checks is
# the image whose digest gets published.
#
# How the bytes reach the later jobs: every job here talks to the same
# Docker daemon on the runner host (DOCKER_HOST below, as the existing jobs
# already do), so an image built in this job is normally still in that
# daemon's store for the rest of the pipeline. No `docker save` artifact is
# needed, which matters because the mockingbird image is a few hundred
# megabytes and this runs on every branch.
#
# That daemon is SHARED across every pipeline running on this host at once
# (#112), which the prune two paragraphs down was not written for: it used
# to assume the local tag it just built was the only copy, so deleting every
# other pipeline's tag was harmless because "harmless" meant "self-healing
# for a runner that only ever has one pipeline on it". On a shared daemon it
# instead deletes whatever another still-running pipeline is mid-e2e-stage
# with, and that pipeline's jobs then fail for a reason that has nothing to
# do with the code under test. Rather than change what gets pruned or when
# (docs/ci-hops.md's #112 write-up has the four options considered and why
# this one won), this job now also pushes each image to this project's own
# container registry ($CI_REGISTRY_IMAGE, via scripts/publish-image.sh,
# which pushes and then proves the round trip) and records the resulting
# repo@digest in release.env alongside the local tag. Every later job that
# uses one of these images calls scripts/ci-ensure-image.sh first, which
# pulls that digest back and retags it locally if the daemon's local copy
# is ever missing. Whoever prunes, and whenever, the worst case is now one
# recovery pull instead of a failed job -- unless a job uses the same tag
# TWICE (#112, second incident): the first use's ci-ensure-image.sh call
# already recovered it, but nothing stopped a second concurrent prune from
# deleting it again before the second use, and nothing re-checked before
# that second use ran. That is now fixed at both ends: the prune below
# only removes a tag old enough that no pipeline still running could have
# built it (see that job's own comment), and every script with a second
# use of a shared tag re-runs scripts/ci-ensure-image.sh immediately
# before that second use. This registry push is transport between this
# pipeline's own jobs, not a release: publication that customers or an
# attacker's search engine would ever see is still `release:push`'s
# alone, to the four *_MIRROR_REPO variables above, unchanged by any of
# this.
#
# The internal registry needs a cleanup policy of its own -- deleting
# `ci-.*` tags older than about a week is plenty, since nothing here is
# ever read after its pipeline finishes. That is a project setting
# (Settings > Packages and registries > Container registry) only the
# project owner can set; without it the registry keeps every pipeline's
# images forever and grows without bound. That is growth, not breakage:
# no job here reads an old tag, so an unset cleanup policy costs disk on
# the registry, never a wrong or missing image.
#
# This job records each image's config ID, and `release:push` refuses to
# publish anything whose config ID is not the one recorded here -- that
# check does not depend on which daemon still holds the bytes, because
# scripts/ci-ensure-image.sh has already made sure release:push's own local
# tag is the real thing before it ever looks at the ID.
#
# The stamp is the release version, not a CI-only string, because the
# version has to be in the bytes before the digest exists -- promotion moves
# the tested digest to the version tag and never rebuilds. scripts/release-
# version.sh is the only place that string is decided.
build:images:
  stage: test
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # bash for scripts/release-version.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
  script:
    # Build images from earlier pipelines are pruned here rather than in an
    # after_script somewhere: a later job cannot know whether the pipeline
    # still needs them, and a cancelled pipeline never reaches its cleanup
    # at all. #145: the prune used to list only the local repo name, so it
    # removed the local "<name>-build:<pipeline id>" tag and left the
    # registry-named "${CI_REGISTRY_IMAGE}/<name>-build:ci-<pipeline id>"
    # tag on the same image, which kept the image alive for good. On the
    # runner host on 2026-09-27, 268 of 305 images were this project's
    # build images this left behind. scripts/ci-prune-build-images.sh has
    # the fixed loop and its own header for the age rule, the busybox
    # `date -D` parsing, and the failure posture.
    - scripts/ci-prune-build-images.sh
    - |
      set -eu
      stamp="$(scripts/release-version.sh --stamp "$CI_COMMIT_SHA")"
      echo "building images as $stamp"
      # Job-token creds, exactly as release:push logs in to GHCR -- never a
      # personal token -- and only for this project's own registry, which
      # every job in this pipeline can already reach.
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      : > release.env
      # One list entry per image -- the build, the local tag, the registry
      # push and the dotenv lines below all read from $name.
      for name in birdcage mockingbird nightjar smb-lure holder opencanary; do
        local_tag="${name}-build:${CI_PIPELINE_ID}"
        # --provenance=false --sbom=false: with the containerd image store
        # (Docker 29's default on the runner) a build otherwise produces an
        # OCI index -- the image manifest plus a BuildKit provenance
        # manifest -- and pushing that index to the GitLab registry fails
        # with "blob unknown to registry" naming the image manifest
        # (pipeline #1474, #112). A plain single image manifest pushes and
        # pulls by digest cleanly, and the attestation this project relies
        # on is release:attest's own cosign signature, not BuildKit's.
        docker build --provenance=false --sbom=false \
          --build-arg VERSION="$stamp" \
          --file "build/${name}/Dockerfile" --tag "$local_tag" .
        # The config ID is the identity later jobs check back against. It is
        # not the registry digest -- that only exists once something is
        # pushed -- but it is what makes "the image I tested" and "the
        # image I am pushing" the same statement.
        image_id="$(docker image inspect --format '{{.Id}}' "$local_tag")"
        # Pushed to this project's OWN registry, never GHCR -- this is
        # transport between this pipeline's own jobs (#112), so a shared
        # daemon's prune below can never delete the only copy. It is not a
        # release: release:push alone publishes anywhere a consumer would
        # ever pull from. scripts/publish-image.sh both pushes and proves
        # the round trip, the same guarantee release:push already relies on
        # for GHCR, reused here rather than re-implemented.
        registry_tag="${CI_REGISTRY_IMAGE}/${name}-build:ci-${CI_PIPELINE_ID}"
        docker tag "$local_tag" "$registry_tag"
        digest="$(scripts/publish-image.sh "$registry_tag" "$image_id")"
        # `-` becomes `_` as well as upper-casing: smb-lure's dotenv keys
        # would otherwise be SMB-LURE_BUILD_IMAGE, which is not a usable
        # variable name, and the dotenv report would be rejected rather
        # than the pipeline failing anywhere near the cause.
        upper="$(printf '%s' "$name" | tr 'a-z-' 'A-Z_')"
        {
          echo "${upper}_BUILD_IMAGE=$local_tag"
          echo "${upper}_BUILD_ID=$image_id"
          echo "${upper}_BUILD_DIGEST=${CI_REGISTRY_IMAGE}/${name}-build@${digest}"
        } >> release.env
      done
      echo "BIRDCAGE_STAMP=$stamp" >> release.env
      cat release.env
  artifacts:
    # dotenv rather than files: these are ten short strings every later
    # job needs as variables, and none of them is worth a download.
    reports:
      dotenv: release.env
    expire_in: 1 day

test:image:birdcage:
  stage: test
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: birdcage-test-$CI_JOB_ID
  before_script:
    # bash for scripts/ci-ensure-image.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
    # This job's alpine probe container is pulled by this job's own daemon
    # call (docker run against $ALPINE_IMAGE), not by GitLab's runner-level
    # image auth -- that only covers this job's own image:/services:.
    # $ALPINE_IMAGE already names the dependency proxy, but a pull still
    # needs a credential for it (refs #128). --password-stdin only, never
    # echoed.
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned the local tag
    # between when it was built and now (#112) -- this recovers it from the
    # registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    # The image under test is the one build:images produced, not a fresh
    # build of the same source -- see that job's header for why that
    # distinction is the whole point. Tagged under this job's own name so
    # the after_script below can clean up without touching the shared build
    # tag the release jobs still need.
    - docker tag "$BIRDCAGE_BUILD_IMAGE" "$APP"
    # #90: the release job stamps the version into the binary and compares
    # it back, so the stamping itself is proved here rather than at a
    # release nobody can retry. An image whose VERSION argument is silently
    # ignored still starts and still serves, so only asking it wins.
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    - >-
      docker run --detach --name "$APP"
      --env BIRDCAGE_HTTP_ADDR=127.0.0.1:8080
      --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
      --tmpfs /var/lib/birdcage:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 64 --memory 256m --cpus 0.5
      "$APP"
    - |
      for attempt in $(seq 1 20); do
        if docker run --rm --network "container:$APP" "$ALPINE_IMAGE" \
             wget -q -O - http://127.0.0.1:8080/api/alerts 2>/dev/null | grep -q '"alerts"'; then
          echo "/api/alerts answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 20 ]; then
          echo "/api/alerts never answered; container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
  after_script:
    - docker rm --force "birdcage-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker image rm "birdcage-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# The agent fails closed without a token and client certificate in its
# state directory, so the job mints throwaway ones into a named volume
# (never into the repository) and points MOCKINGBIRD_BIRDCAGE_URL at a
# closed port: what is under test is that the image starts as uid 65532
# and its own loopback receiver answers. Since issue #132 this image
# carries no honeypot service of its own to prove against -- OpenCanary
# moved to build/opencanary, and test:image:opencanary below is its own
# equivalent of this job, proving the FTP banner the way this job used
# to. The loopback path from OpenCanary to the agent across the two
# containers is #48's/#132's end-to-end test, not this job's.
test:image:mockingbird:
  stage: test
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: mockingbird-test-$CI_JOB_ID
  before_script:
    # bash for scripts/ci-ensure-image.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned the local tag
    # between when it was built and now (#112) -- this recovers it from the
    # registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    # As in test:image:birdcage: the image under test is the one
    # build:images produced, so the bytes that answer these checks are the
    # bytes release:push publishes.
    - docker tag "$MOCKINGBIRD_BUILD_IMAGE" "$APP"
    # #97, matching test:image:birdcage's own check (#90): the stamping is
    # proved here rather than at a release nobody can retry. An image whose
    # VERSION argument is silently ignored still starts and still serves,
    # so only asking it wins.
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    - docker volume create "$APP-state" >/dev/null
    - >-
      docker run --rm --volume "$APP-state:/s" "$ALPINE_IMAGE" sh -c '
      apk add --no-cache openssl >/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/ca-key.pem -out /s/ca.pem -days 1 -subj /CN=ci-throwaway-ca 2>/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/client-key.pem -out /s/client.pem -days 1 -subj /CN=ci-throwaway-client 2>/dev/null &&
      rm /s/ca-key.pem && echo ci-throwaway-token > /s/token &&
      echo https://127.0.0.1:1 > /s/ingest-url &&
      chown -R 65532:65532 /s && chmod 600 /s/*'
    # --cap-add NET_RAW is the capability the port-scan detector needs
    # (#65). It has no effect here because --init and --security-opt
    # no-new-privileges are both set: the agent is started by an init
    # holding no capabilities, and no-new-privileges stops it gaining the
    # binary's file capability (docs/enrolment.md has the detail; without
    # --init, as the printed command runs it, the capability survives).
    # So this job's container reports port-scan detection off. That is deliberate:
    # this job exists to prove nothing in the image runs as root, and
    # relaxing its hardening to exercise a different feature would cost
    # more than it proves. The capability itself is proved by the image
    # test in #65 and by the unit tests in internal/agent/portscan.
    #
    # No --tmpfs for /var/log/opencanary or /var/tmp any more (#132):
    # this image never writes to either now -- OpenCanary owned both,
    # and OpenCanary is a different image. The log tailer opening an
    # empty, read-only, image-baked directory and finding no file there
    # is an ordinary "nothing to read yet" state (config.go's own
    # comment), not a startup failure.
    - >-
      docker run --detach --name "$APP" --init
      --volume "$APP-state:/var/lib/mockingbird"
      --read-only --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges
      --pids-limit 64 --memory 256m --cpus 0.5
      --env MOCKINGBIRD_BIRDCAGE_URL=https://127.0.0.1:1
      "$APP"
    - |
      # #132: OpenCanary is a separate image now (test:image:opencanary
      # below proves its own FTP banner, the way this job used to), so
      # what this job can still prove about this one is that its own
      # loopback receiver -- the socket OpenCanary's webhook posts to --
      # comes up and accepts a connection under the same hardening.
      for attempt in $(seq 1 30); do
        if docker run --rm --network "container:$APP" "$ALPINE_IMAGE" sh -c 'nc -z -w2 127.0.0.1 9919'; then
          echo "the agent's own loopback receiver answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 30 ]; then
          echo "the agent's own receiver never answered on 127.0.0.1:9919"
          echo "container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    # Every process in the container -- docker-init, the agent -- must be
    # uid 65532; a root process here is the failure the image exists to
    # prevent.
    - docker top "$APP" -o pid,user,args
    - docker top "$APP" -o pid,user,args | awk 'NR > 1 && $2 != "65532" { bad = 1; print "not 65532:", $0 } END { exit bad }'
  after_script:
    - docker rm --force "mockingbird-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker volume rm "mockingbird-test-$CI_JOB_ID-state" >/dev/null 2>&1 || true
    - docker image rm "mockingbird-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# test:image:opencanary is issue #132's own split of what
# test:image:mockingbird used to prove about the combined image: OpenCanary
# starts as uid 65532 under the exact hardening this image ships with
# (build/opencanary/README.md has the per-flag evidence) and answers a real
# FTP client. Unlike the agent, OpenCanary needs the sysctl to bind ports
# under 1024 at all -- see build/opencanary/Dockerfile's own comment -- so
# this job's own throwaway holder gives it a network namespace to bind in,
# the same shape scripts/e2e/stack.sh's start_holder uses for the real
# journeys.
test:image:opencanary:
  stage: test
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: opencanary-test-$CI_JOB_ID
    APP_HOLDER: opencanary-test-holder-$CI_JOB_ID
    APP_SINK: opencanary-test-sink-$CI_JOB_ID
  before_script:
    # bash for scripts/ci-ensure-image.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - docker tag "$OPENCANARY_BUILD_IMAGE" "$APP"
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    # A throwaway holder (#126), exactly as an operator's own enrolment
    # would deploy one, so OpenCanary has a network namespace to bind its
    # ports in without owning one directly -- the shape it actually ships
    # in, not a simplification of it.
    - >-
      docker run --detach --name "$APP_HOLDER"
      --read-only --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 16 --memory 32m
      "$HOLDER_BUILD_IMAGE"
    # A stand-in for the agent's event receiver on 127.0.0.1:9919 in the
    # holder's namespace, started before OpenCanary. OpenCanary's webhook
    # logger treats a refused connection there as fatal to loading the
    # whole application (ADR-0013, consequence 4; pipeline 1702 failed
    # exactly this way), so in production the agent starts first. This
    # job tests the image, not the agent, so a plain stdlib HTTP server
    # that answers 202 (the status opencanary.conf expects) to every POST
    # stands in for it. It runs from the image under test -- the only
    # Python this job has -- under the same hardening as OpenCanary, as
    # uid 65532.
    - |
      docker run --detach --name "$APP_SINK" \
        --network "container:$APP_HOLDER" \
        --read-only --cap-drop ALL --security-opt no-new-privileges \
        --pids-limit 8 --memory 32m \
        --entrypoint /usr/bin/python3 "$APP" -c '
      import http.server as h
      class R(h.BaseHTTPRequestHandler):
          def do_POST(self):
              self.rfile.read(int(self.headers.get("Content-Length") or 0))
              self.send_response(202)
              self.send_header("Content-Length", "0")
              self.end_headers()
          def log_message(self, *a):
              pass
      h.HTTPServer(("127.0.0.1", 9919), R).serve_forever()
      '
      for attempt in $(seq 1 15); do
        if docker run --rm --network "container:$APP_HOLDER" "$ALPINE_IMAGE" nc -z 127.0.0.1 9919; then
          echo "event sink listening on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 15 ]; then
          echo "event sink never listened on 127.0.0.1:9919; its log follows"
          docker logs "$APP_SINK"
          exit 1
        fi
      done
    - >-
      docker run --detach --name "$APP" --init
      --network "container:$APP_HOLDER"
      --sysctl net.ipv4.ip_unprivileged_port_start=0
      --tmpfs /var/tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
      --tmpfs /var/log/opencanary:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      --read-only --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 32 --memory 128m --cpus 0.5
      "$APP"
    - |
      # The `sleep 2` and the banner assertion are #77's own finding,
      # carried over unchanged from this job's pre-#132 shape: BusyBox nc
      # shuts the socket down for writing the moment its stdin ends and
      # can exit before draining what the server already sent, so holding
      # stdin open until the reply arrives is what makes this a readiness
      # check rather than a timing measurement. Still assert the banner,
      # not just that the port accepts a connection -- a bare connect
      # would pass against a socket with nothing behind it.
      for attempt in $(seq 1 30); do
        reply=$(docker run --rm --network "container:$APP_HOLDER" "$ALPINE_IMAGE" \
                  sh -c '{ printf "USER x\r\nPASS y\r\nQUIT\r\n"; sleep 2; } | nc -w 5 127.0.0.1 21' || true)
        if printf '%s' "$reply" | grep -q '^220 '; then
          echo "FTP answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 30 ]; then
          if [ -n "$reply" ]; then
            echo "FTP replied but never sent a 220 greeting. Last reply:"
            printf '%s\n' "$reply"
          else
            echo "FTP sent nothing at all -- no connection, or no reply within the timeout."
          fi
          echo "container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    # Every process in the container -- docker-init, twistd -- must be
    # uid 65532; a root process here is the failure the image exists to
    # prevent.
    - docker top "$APP" -o pid,user,args
    - docker top "$APP" -o pid,user,args | grep -q ' 65532 .*python3' || { echo "OpenCanary is not running as 65532"; exit 1; }
    - docker top "$APP" -o pid,user,args | awk 'NR > 1 && $2 != "65532" { bad = 1; print "not 65532:", $0 } END { exit bad }'
  after_script:
    - docker rm --force "$APP" >/dev/null 2>&1 || true
    - docker rm --force "$APP_SINK" >/dev/null 2>&1 || true
    - docker rm --force "$APP_HOLDER" >/dev/null 2>&1 || true
    - docker image rm "$APP" >/dev/null 2>&1 || true

# Nightjar's own equivalent of test:image:mockingbird above, #108 section
# 8: proves non-root start under the exact run-command shape the enrol
# renderer prints -- --read-only, every capability dropped, the full
# internal/hostmask flag list, and a real Grype scan of the runner's own
# filesystem with a real, freshly-fetched vulnerability database (no
# fixture engine here, unlike scripts/e2e/scanner.sh's later, controlled
# journey -- this job's job is the image, not the finding). Nightjar has
# no listener to answer, so what stands in for test:image:mockingbird's
# FTP banner check is proving the scan itself completes and is posted --
# a throwaway birdcage TLS listener on loopback is stood up so SendScan
# has somewhere real to reach, and its own log is what proves a snapshot
# arrived, rather than trusting a closed-port warning to mean "the scan
# itself was fine."
test:image:nightjar:
  stage: test
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: nightjar-test-$CI_JOB_ID
  before_script:
    # bash for scripts/ci-ensure-image.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned the local tag
    # between when it was built and now (#112) -- this recovers it from the
    # registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$NIGHTJAR_BUILD_IMAGE" "$NIGHTJAR_BUILD_DIGEST"
    - docker tag "$NIGHTJAR_BUILD_IMAGE" "$APP"
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    - docker volume create "$APP-state" >/dev/null
    - docker volume create "$APP-db" >/dev/null
    - >-
      docker run --rm --volume "$APP-state:/s" "$ALPINE_IMAGE" sh -c '
      apk add --no-cache openssl >/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/ca-key.pem -out /s/ca.pem -days 1 -subj /CN=ci-throwaway-ca 2>/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/client-key.pem -out /s/client.pem -days 1 -subj /CN=ci-throwaway-client 2>/dev/null &&
      rm /s/ca-key.pem && echo ci-throwaway-token > /s/token &&
      echo https://127.0.0.1:1 > /s/ingest-url &&
      chown -R 65532:65532 /s && chmod 600 /s/*'
    # No published port, no --cap-add, no --sysctl (#108 section 4): the
    # printed run command's exact flag set, mask list included, so this
    # job would fail if a future edit ever let the two drift apart.
    - >-
      docker run --detach --name "$APP" --restart unless-stopped
      --read-only --cap-drop ALL --security-opt no-new-privileges
      -v /:/host:ro
      -v /dev/null:/host/etc/shadow:ro
      -v /dev/null:/host/etc/gshadow:ro
      --tmpfs /host/etc/ssh:ro
      --tmpfs /host/root:ro
      --tmpfs /host/proc:ro
      --tmpfs /host/run:ro
      --tmpfs /host/sys:ro
      --tmpfs /host/dev:ro
      --tmpfs /host/tmp:ro
      --tmpfs /host/var/tmp:ro
      --tmpfs /host/home:ro
      --volume "$APP-state:/var/lib/nightjar"
      --volume "$APP-db:/var/lib/nightjar-grype-db"
      --pids-limit 64 --memory 768m --cpus 1.0
      --env NIGHTJAR_BIRDCAGE_URL=https://127.0.0.1:1
      --env NIGHTJAR_SCAN_INTERVAL_S=3600
      "$APP"
    # Nightjar posts nothing this job can read back without a real
    # birdcage listening -- the closed port above proves nothing except
    # that the process survives a send failure. So the check here is the
    # one this job can make honestly: the process stays up (no
    # crash-loop from a --read-only filesystem grype cannot get scratch
    # space from -- exactly the failure this job would have caught
    # before the image shipped) and it reaches the point of attempting
    # to send, which only happens after a real mount check and a real
    # grype run both returned.
    - |
      for attempt in $(seq 1 40); do
        if docker logs "$APP" 2>&1 | grep -q "send scan"; then
          echo "reached send-scan on attempt $attempt"
          break
        fi
        if [ "$(docker inspect "$APP" --format '{{.State.Status}}')" != "running" ]; then
          echo "container is not running; log follows"
          docker logs "$APP"
          exit 1
        fi
        sleep 3
        if [ "$attempt" = 40 ]; then
          echo "never reached send-scan within the timeout; log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    # Every process in the container must be uid 65532 -- a root process
    # here is the failure this image exists to prevent, same assertion
    # test:image:mockingbird makes.
    - docker top "$APP" -o pid,user,args
    - docker top "$APP" -o pid,user,args | awk 'NR > 1 && $2 != "65532" { bad = 1; print "not 65532:", $0 } END { exit bad }'
  after_script:
    - docker rm --force "nightjar-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker volume rm "nightjar-test-$CI_JOB_ID-state" "nightjar-test-$CI_JOB_ID-db" >/dev/null 2>&1 || true
    - docker image rm "nightjar-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# ---------------------------------------------------------------------------
# E2E -- the real stack, deployed and exercised (#78). Where the two
# test:image:* jobs above prove each image starts and stays unprivileged
# on its own, this stage puts them together: birdcage serving real TLS,
# a canary enrolled by the very `docker run` command the product printed,
# and a real hit travelling from OpenCanary to the dashboard's API.
# AGENTS.md's "Live testing is not optional" is what this stage is for.
#
# Everything lives in scripts/e2e/ rather than here, so the same run
# happens on a workstation -- which is how anyone debugs a red job:
#
#     eval "$(scripts/e2e/stack.sh up)"
#     scripts/e2e/enrol-and-hit.sh
#     scripts/e2e/stack.sh logs
#     scripts/e2e/stack.sh down
#
# With neither override set, `up` builds both images from scratch, same
# as always -- a workstation debugging a red job has no build:images run
# to hand it images. In CI (#98), E2E_BIRDCAGE_IMAGE and
# E2E_MOCKINGBIRD_IMAGE below point stack.sh at the tags build:images
# already built, so the journey tests those bytes instead of building a
# second copy of the same source.
#
# Adding a journey (#79 port scan, #80 mail, #81 dashboard) is a job of
# the same four lines with a different script name; the stack it needs
# is already stood up by stack.sh.
#
# E2E_PREFIX names every container, volume, network and image tag the
# run creates, so parallel pipelines never collide -- the same reason
# the test:image:* jobs above carry $CI_JOB_ID -- and so after_script
# can clean up a job that failed or was cancelled. Nothing is left
# behind either way.
e2e:enrol-and-hit:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Runs four containers at once, using the images build:images already
  # built; the light lane's 4 CPU / 6 GB is not enough headroom for that.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    # Issue #78 journey C: the birdcage image alone, refusing to start on
    # a handful of bad configurations -- before stack.sh up, since it
    # needs no stack (or the stack's own well-configured containers)
    # to make its point.
    - scripts/e2e/startup-refusals.sh
    - eval "$(scripts/e2e/stack.sh up)"
    - scripts/e2e/enrol-and-hit.sh
    - scripts/e2e/refusals.sh
    # Issue #54: replaces the canary's containers by running the upgrade
    # command the canary page prints, and hands the same canary back ok.
    # Before lifecycle.sh, whose deliberate use of a rotated-out token
    # holds token_conflict for 24 h, so the canary never reads ok again.
    - scripts/e2e/upgrade.sh
    - scripts/e2e/lifecycle.sh
    - scripts/e2e/surface.sh
  after_script:
    - scripts/e2e/stack.sh down

# The same journeys against the other engine birdcage ships. Separate
# job rather than a matrix entry so a Postgres-only failure is named as
# one in the pipeline, and so the SQLite run -- the common case -- is
# not held up behind the slower one.
e2e:enrol-and-hit:postgres:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Runs four containers at once, using the images build:images already
  # built; the light lane's 4 CPU / 6 GB is not enough headroom for that.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-pg-$CI_JOB_ID
    E2E_BACKEND: postgres
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only. openssl is for
    # scripts/e2e/stack.sh's build_postgres_tls_image (#84), which builds
    # the one-line derived Postgres image this backend needs.
    - apk add --no-cache bash openssl >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    # Issue #78 journey C: the birdcage image alone, refusing to start on
    # a handful of bad configurations -- before stack.sh up, since it
    # needs no stack (or the stack's own well-configured containers)
    # to make its point.
    - scripts/e2e/startup-refusals.sh
    - eval "$(scripts/e2e/stack.sh up)"
    - scripts/e2e/enrol-and-hit.sh
    - scripts/e2e/refusals.sh
    # Issue #54: replaces the canary's containers by running the upgrade
    # command the canary page prints, and hands the same canary back ok.
    # Before lifecycle.sh, whose deliberate use of a rotated-out token
    # holds token_conflict for 24 h, so the canary never reads ok again.
    - scripts/e2e/upgrade.sh
    - scripts/e2e/lifecycle.sh
    - scripts/e2e/surface.sh
  after_script:
    - scripts/e2e/stack.sh down

# Issue #130 (ADR-0012 Part B): agent-made keys, seven-day client
# certificates renewed from half-life, cert-bound tokens, conflict
# detection and one-action revocation -- four journeys, one job, the
# same shape as e2e:enrol-and-hit above: they share one credentials
# stack (E2E_CLIENT_CERT_TTL turns the whole run's certificates into a
# few minutes rather than seven days) and one failure surface --
# everything here is the credential's own lifecycle, not four unrelated
# things sharing a runner by coincidence. Four separate jobs would each
# pay for their own stack.sh up (build, TLS, enrolment) to prove one
# step of a lifecycle the others already stood up.
e2e:agent-credentials:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  # agent-renewal.sh and agent-expiry.sh both poll for several minutes
  # of real half-life and expiry; nothing here is CPU-bound, but the
  # wall clock means this job runs longest of the e2e stage.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-cred-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
    # Four minutes: long enough that the primary canary's own heartbeat
    # (60s ticks) reaches half-life and renews well inside it, short
    # enough that agent-expiry.sh's full wait for expiry stays a matter
    # of minutes rather than the real seven days (docs/configuration.md).
    E2E_CLIENT_CERT_TTL: 4m
  before_script:
    - apk add --no-cache bash openssl >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - eval "$(scripts/e2e/stack.sh up)"
    - scripts/e2e/agent-provisioning.sh
    - scripts/e2e/agent-renewal.sh
    - scripts/e2e/agent-conflict.sh
    - scripts/e2e/agent-expiry.sh
  after_script:
    - scripts/e2e/stack.sh down

# The same four journeys against the other engine birdcage ships:
# client_certs' own migration comment is explicit that the two engines
# compare stored text timestamps at different resolutions
# (docs/flakes.md), and this feature's health signals (renewal_stalled,
# certificate_expired) are computed entirely from those comparisons --
# the one class of bug this file exists to catch that SQLite alone
# cannot.
e2e:agent-credentials:postgres:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
