# Issue #78 journey 3 (#46's front half): a real smbclient against a
# real smbd with the full_audit VFS module, over the real chain proved
# on 2026-09-20 -- OpenCanary parsing that audit line and the agent
# forwarding it to birdcage. build/e2e-samba is a CI-only image (ADR-0008:
# Samba never goes near build/mockingbird/Dockerfile); scripts/e2e/smb-stack.sh
# is the extra infrastructure only this journey needs, started here
# rather than by `stack.sh up`, so the other two journeys above stay as
# fast as they were.
e2e:smb:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Builds one extra image (the Samba server; the second canary's
  # Mockingbird tag is the one build:images already built) and runs a
  # Samba server plus a second canary alongside the base stack's four
  # containers.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-smb-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - eval "$(scripts/e2e/stack.sh up)"
    - eval "$(scripts/e2e/smb-stack.sh up)"
    - scripts/e2e/smb.sh
  after_script:
    # smb-stack.sh down first: it removes containers attached to the
    # network stack.sh down is about to remove, and stack.sh down
    # tolerates -- but need not be made to work around -- a network that
    # still has endpoints on it.
    - scripts/e2e/smb-stack.sh down
    - scripts/e2e/stack.sh down

# Issue #87's own journey, and #123's acceptance. Deliberately separate
# from e2e:smb above rather than a third line added to it: that job drives
# build/e2e-samba and OpenCanary's own smb module, which is the arrangement
# #78 proved and #87 decision 40b replaced, and it still guards that path.
# This one runs the image that actually ships (build/smb-lure) beside a
# canary that reads the audit file with the agent's own tailer and parse,
# and asserts that one file opened is exactly ONE alert naming the share
# and the path -- across a restart of the canary.
e2e:smb-lure:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points the harness at
  # (#98), so the journey tests the bytes that would ship -- including the
  # lure's own -- rather than a second build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Builds one extra image (a small Alpine smbclient; the lure, the holder
  # and the canary are all tags build:images already built) and runs a
  # second canary, the holder and the lure alongside the base stack's
  # four containers.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-smb-lure-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_SMB_LURE_IMAGE: $SMB_LURE_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$SMB_LURE_BUILD_IMAGE" "$SMB_LURE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    # Neither the lure, the holder nor OpenCanary has a test:image job of
    # its own; their version stamps, which release:promote relies on
    # (#125, #126, #132), are checked here.
    - |
      got="$(docker run --rm "$SMB_LURE_BUILD_IMAGE" version)"
      if [ "$got" != "$BIRDCAGE_STAMP" ]; then
        echo "smb-lure reports '$got', expected '$BIRDCAGE_STAMP'"
        exit 1
      fi
      echo "smb-lure version stamped: $got"
    - |
      got="$(docker run --rm "$HOLDER_BUILD_IMAGE" version)"
      if [ "$got" != "$BIRDCAGE_STAMP" ]; then
        echo "holder reports '$got', expected '$BIRDCAGE_STAMP'"
        exit 1
      fi
      echo "holder version stamped: $got"
    - |
      got="$(docker run --rm "$OPENCANARY_BUILD_IMAGE" version)"
      if [ "$got" != "$BIRDCAGE_STAMP" ]; then
        echo "opencanary reports '$got', expected '$BIRDCAGE_STAMP'"
        exit 1
      fi
      echo "opencanary version stamped: $got"
    - eval "$(scripts/e2e/stack.sh up)"
    - eval "$(scripts/e2e/smb-lure-stack.sh up)"
    - scripts/e2e/smb-lure.sh
  after_script:
    # smb-lure-stack.sh down first, for the reason e2e:smb gives: it removes
    # containers attached to the network stack.sh down is about to remove.
    - scripts/e2e/smb-lure-stack.sh down
    - scripts/e2e/stack.sh down

