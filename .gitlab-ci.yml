# GitLab is where birdcage is developed: branches, merge requests and the
# dev -> preview -> main promotions all happen here, and this file is the
# CI that gates them. GitHub is a read-only mirror of those three branches
# (the `sync` stage pushes each one after a merge) and keeps CodeQL and
# dependency review. The general model is in the gitlab-first-migration
# skill; the jobs below carry what GitHub's ci.yml, licence.yml and
# branch-policy.yml used to (all three retired once this file was green).
#
# The `sync` stage reads MIRROR_TO_GITHUB and GITHUB_MIRROR_SSH_KEY, both
# protected project CI/CD variables the owner set on 2026-09-13. Nothing
# here sets them, and it fires only on a push pipeline for one of the three
# branches -- in practice, the push a merge makes.
#
# Runner lanes (ai/agent-infra#3): `big` is 8 CPU / 18 GB, `light` is
# 4 CPU / 6 GB. A job with no matching tag does not run at all.

stages:
  - lint
  - test
  - e2e
  - release
  - sync

default:
  tags: [light]
  interruptible: true

variables:
  GOFLAGS: "-mod=readonly"
  # Where the two images are published (#90). Deliberately NOT named
  # BIRDCAGE_IMAGE: that is the environment variable
  # scripts/verify-validation-evidence.sh reads to know which repository it
  # is judging, and a pipeline-wide value of that name would be inherited by
  # every verifier call -- including the one checking the *other* image,
  # which would then verify the wrong repository and still pass.
  GHCR_BIRDCAGE_REPO: ghcr.io/tomlawesome/birdcage
  GHCR_MOCKINGBIRD_REPO: ghcr.io/tomlawesome/mockingbird

.gate: &gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "preview"
    - if: $CI_COMMIT_BRANCH == "main"

# The higher bar (#91, docs/ci-hops.md): extra jobs, run only when entering
# and sitting on `preview` and `main`, where a Postgres-only regression is
# worth catching before -- and after -- the promotion lands. Nothing here
# replaces the gate above, and nothing was moved out of it; the gate's own
# jobs still run at these hops too, because `*gate` names them as well.
.higher_bar: &higher_bar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
    - if: $CI_COMMIT_BRANCH == "preview"
    - if: $CI_COMMIT_BRANCH == "main"

.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# ---------------------------------------------------------------------------
# POLICY -- the promotion order. This is the gate GitHub's branch-policy.yml
# used to be. Bites only if the project requires a passing pipeline to
# merge; otherwise a warning.
# ---------------------------------------------------------------------------
policy:promotion-hop:
  stage: lint
  image: alpine:3.24
  needs: []
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  script:
    - 'echo "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        main)
          [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "preview" ] || { echo "main only accepts merge requests from preview"; exit 1; }
          ;;
        preview)
          [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "dev" ] || { echo "preview only accepts merge requests from dev"; exit 1; }
          ;;
      esac

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
lint:go:
  stage: lint
  image: golang:1.27
  <<: [*gate, *git_safe]
  script:
    - go build ./...
    - go vet ./...
    - |
      files=$(git ls-files '*.go')
      [ -n "$files" ] || { echo "git ls-files returned no Go files"; exit 1; }
      unformatted=$(gofmt -l $files)
      [ -z "$unformatted" ] || { echo "Not gofmt-clean:"; echo "$unformatted"; gofmt -d $files; exit 1; }
    # Built from source with the image's Go: the prebuilt binary is built
    # with an older Go and refuses go.mod's `go 1.27.0` directive.
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - golangci-lint run ./...

# Ported from licence.yml; the script is host independent by design.
lint:licences:
  stage: lint
  image: golang:1.27
  <<: [*gate, *git_safe]
  script:
    - scripts/licence-check.sh

# The pip counterpart (#95): before this, nothing gated the Python
# packages installed into the mockingbird image at all. python:3.13-slim-
# trixie, not a generic Python image, because that is exactly the base
# build/mockingbird/Dockerfile's honeypot stage installs onto, so what
# this job sees is what actually ships. Its own tests are
# scripts/licence-check-python.test.sh, run here too, same reasoning as
# lint:ci's guard tests.
lint:licences-python:
  stage: lint
  image: python:3.13-slim-trixie
  <<: [*gate, *git_safe]
  script:
    - scripts/licence-check-python.test.sh
    - scripts/licence-check-python.sh

# The agent ships in the Mockingbird container, on the machine the product
# expects to be attacked. No birdcage server package may reach it --
# ADR-0008 decision 4.
# ---------------------------------------------------------------------------
# The live checks in AGENTS.md ("Live testing is not optional") are only
# worth having if they cannot be quietly switched off. This job is that
# rule as a red pipeline: it refuses an e2e stage that is missing, empty,
# allowed to fail, manual, or ruled out of merge requests. Its own tests
# are scripts/ci-e2e-guard.test.sh, run here too -- a guard nobody tests
# guards nothing.
# ---------------------------------------------------------------------------
lint:ci:
  stage: lint
  image: python:3.13-alpine
  <<: *gate
  needs: []
  before_script:
    - apk add --no-cache bash >/dev/null
    - pip install --quiet pyyaml
  script:
    - python3 scripts/ci-e2e-guard.py
    - scripts/ci-e2e-guard.test.sh
    # The same idea for the release stage (#90): the split that keeps one
    # job from both judging an artefact and shipping it is prose until
    # something fails red when it is undone.
    - python3 scripts/ci-release-guard.py
    - scripts/ci-release-guard.test.sh

lint:agent-deps:
  stage: lint
  image: golang:1.27
  <<: [*gate, *git_safe]
  script:
    - scripts/agent-deps-check.sh

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

# Frontend: type-check, unit tests, the two pixel gates against the
# round-6 concept shots, then the production build the Go binary embeds.
# The fonts.conf makes the generic font families resolve to what the
# reference shots were rendered with (frontend/scripts/compare-fonts.conf
# explains; GitHub run 34747740616 is what happens without it).
test:frontend:
  stage: test
  image: node:22-trixie
  <<: *gate
  # This job needs nothing any lint job produces, but with no needs: key
  # it waited for the whole lint stage anyway before starting, and
  # test:smoke then waited on its artifacts in turn -- the longest chain
  # in the pipeline, scheduled to start last. No saving is claimed for
  # this: the runner is shared with every other project on this host and
  # wall clock for the same gate ranges from 263 to 1620 seconds, so one
  # pipeline cannot show the effect. See docs/ci-hops.md, which explains
  # why quoting a figure from a single run is a mistake. The dependency
  # was simply never real.
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    # Licence gate for the npm tree (#92). It lives here, rather than in
    # lint:licences with its Go counterpart, because it needs an
    # installed node_modules and this is the only job that has one --
    # a separate job would pay a second `npm ci` on every merge request
    # to check the same tree. It runs before the tests so a licence
    # problem is reported without waiting for them. node:22-trixie ships
    # python3 (3.13.5, verified), which the checker needs.
    - ../scripts/licence-check-npm.sh
    - npm run check
    # Coverage, not a bare test run (#74). The thresholds in
    # vitest.config.ts are a ratchet at today's numbers, so this fails if
    # coverage falls. Proved to fail: forcing the branch threshold to 95
    # exits 1 with "Coverage for branches (60.41%) does not meet global
    # threshold".
    - npm run test:coverage
    - npx playwright install --with-deps chromium
    - mkdir -p ~/.config/fontconfig && cp scripts/compare-fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f
    - fc-match sans-serif && fc-match monospace
    - npm run compare:band
    - npm run compare:below-band
    - npm run build
  # Surfaces the total in the job list, and feeds GitLab the per-line
  # cobertura report so coverage shows on the merge request diff rather
  # than only in this log.
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    paths:
      - frontend/dist/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 1 day
    when: always

# Go tests against SQLite and a real Postgres (issue #7, ADR-0001):
# BIRDCAGE_TEST_DATABASE_URL is what tells internal/db/dbtest the
# Postgres is there; unset, those tests silently run SQLite-only.
#
# TLS since #84 (birdcage now refuses a weaker DATABASE_URL at
# start-up -- internal/startcheck, not exercised by this job, but
# BIRDCAGE_TEST_DATABASE_URL should not model a shape birdcage itself
# refuses). The service's entrypoint is overridden to generate a
# throwaway certificate before handing over to the stock entrypoint --
# ported from mikroview's test:postgres job, which solved the same
# problem first, the same way: no image build and no Docker inside this
# job, since `services:` cannot build one.
#
# verify-full, not mikroview's require: this needs the actual chain, so
# `before_script` below captures the certificate the server presents
# over the network with openssl s_client and hands it to psql/pgx as
# sslrootcert -- the certificate is its own CA (self-signed), so the
# leaf the server sent back IS the root verify-full is told to trust.
test:go:
  stage: test
  image: golang:1.27
  <<: [*gate, *git_safe]
  needs: []
  services:
    - name: postgres:17-alpine
      alias: postgres
      entrypoint: ["sh", "-c"]
      command:
        - |
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=postgres" \
            -addext "subjectAltName=DNS:postgres" \
            -keyout /certs/server.key -out /certs/server.crt
          chown postgres:postgres /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          exec docker-entrypoint.sh postgres -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
  variables:
    POSTGRES_PASSWORD: birdcage-ci
    BIRDCAGE_TEST_DATABASE_URL: postgres://postgres:birdcage-ci@postgres:5432/postgres?sslmode=verify-full&sslrootcert=/tmp/postgres-ca.pem
  script:
    # The runner only waits for the port, and Postgres listens briefly
    # during its own init before restarting; ask the server itself.
    - apt-get -qq update && apt-get -qq install -y postgresql-client openssl >/dev/null
    - |
      ready=0
      for attempt in $(seq 1 40); do
        pg_isready -h postgres -U postgres >/dev/null 2>&1 && { ready=1; break; }
        sleep 1
      done
      [ "$ready" = 1 ] || { echo "postgres never became ready"; exit 1; }
    # BIRDCAGE_TEST_DATABASE_URL's sslrootcert names this exact path --
    # captured now, from the running server, rather than shared from the
    # service container, which no volume or filesystem connects this
    # job container to.
    - |
      openssl s_client -starttls postgres -connect postgres:5432 -showcerts </dev/null 2>/dev/null \
        | openssl x509 -outform pem > /tmp/postgres-ca.pem
      [ -s /tmp/postgres-ca.pem ] || { echo "could not capture the postgres server certificate"; exit 1; }
    # -coverprofile alongside -race so one run does both (#74). The
    # floors in supply-chain/coverage-floors.yml are a ratchet at
    # measured values, not the owner's 70-85% band: a threshold set at
    # the band would be red on code nobody touched.
    #
    # Go reports statement coverage, and that already catches an untaken
    # branch: a body that never runs is uncovered statements. What it
    # cannot see is a compound condition. `if a && b` reaches 100% having
    # only ever run (true,true) and (false,true) -- b was never decisive
    # and nothing says so. Demonstrated, not assumed. So the branch floor
    # in the owner's policy is set on the frontend, where vitest reports
    # branches; here the floor is on statements.
    #
    # This run sets BIRDCAGE_TEST_DATABASE_URL, so internal/db is
    # measured against real Postgres here and reads higher than it does
    # on a workstation, where the same tests fall back to SQLite.
    # golang:1.27 ships python3 (3.13.5, verified), which the checker
    # needs.
    # #93: run the suite as a NON-ROOT user. internal/startcheck proves
    # birdcage refuses to start on unsafe file permissions, and those
    # tests skip themselves as uid 0 -- correctly, because root ignores
    # the mode bits they set, so the refusal would "pass" without ever
    # being exercised. This image runs as root, so until now those two
    # tests ran only on whoever happened to run the suite locally. A
    # check that looks enforced and is not is the thing AGENTS.md's live
    # testing rule exists to prevent.
    #
    # Root is still needed for the setup above -- apt-get, and capturing
    # the server certificate -- so only the test run drops privileges.
    # The caches go to a tester-owned directory rather than the image's
    # root-owned /go/pkg/mod, because `go test` writes a lock there when
    # it resolves modules and would fail as a non-root user. Downloading
    # the modules again costs seconds and go.sum still verifies them.
    - |
      set -eu
      useradd --create-home --uid 1001 tester
      install -d -o tester -g tester /tmp/gotest
      # tester has to read the certificate the URL below names.
      chmod 0644 /tmp/postgres-ca.pem
    - >-
      su tester -c "cd '$CI_PROJECT_DIR' &&
      HOME=/home/tester
      GOCACHE=/tmp/gotest/cache
      GOMODCACHE=/tmp/gotest/mod
      GOFLAGS='$GOFLAGS'
      BIRDCAGE_TEST_DATABASE_URL='$BIRDCAGE_TEST_DATABASE_URL'
      go test ./... -race -coverprofile=/tmp/gotest/coverage.out"
    # Read back as root: the profile is tester-owned but world-readable,
    # and nothing below writes to it.
    - go tool cover -func=/tmp/gotest/coverage.out | tail -1
    - python3 scripts/coverage-floor.py /tmp/gotest/coverage.out

# The real binary, with the frontend build embedded, seeded from the
# night fixture and driven by Playwright (frontend/e2e/smoke.mjs). Node
# image plus the Go tarball pinned to go.mod's version, since both are
# needed in one job. SQLite only -- Postgres at the preview bar is #7's.
test:smoke:
  stage: test
  image: node:22-trixie
  <<: [*gate, *git_safe]
  needs:
    - job: test:frontend
      artifacts: true
  script:
    - curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - rm -rf web/dist && cp -r frontend/dist web/dist
    - go build -o birdcage ./cmd/birdcage
    - cd frontend
    - npm ci
    - npx playwright install --with-deps chromium
    - BIRDCAGE_BIN="$CI_PROJECT_DIR/birdcage" npm run smoke

# The two shipped images (#69), built and run as validation only -- nothing
# here pushes to a registry; publishing is a separate job with its own
# credentials (git-and-delivery skill, "Validation and publication are
# separate jobs"). Same shape as mikroview's test:container: the runner
# host's rootless Docker socket, names carrying $CI_JOB_ID so parallel
# pipelines never collide, and probes over --network container: rather
# than --publish, which would race other jobs for host ports.
# ---------------------------------------------------------------------------
# The images are built ONCE, here, and every later job uses those exact
# bytes (#90). Before this job existed, `test:image:birdcage` built its own
# copy and threw it away, so nothing that was tested could ever be the thing
# that shipped -- a release would have pushed a second build of the same
# source and called it validated. Now the image that answers the checks is
# the image whose digest gets published.
#
# How the bytes reach the later jobs: every job here talks to the same
# Docker daemon on the runner host (DOCKER_HOST below, as the existing jobs
# already do), so an image built in this job is still in that daemon's store
# for the rest of the pipeline. No `docker save` artifact is needed, which
# matters because the mockingbird image is a few hundred megabytes and this
# runs on every branch. The assumption -- one runner host, one daemon -- is
# load-bearing, so it is not left implicit: this job records each image's
# config ID, and `release:push` refuses to publish anything whose config ID
# is not the one recorded here. A second runner host would make that check
# fail loudly rather than publish an image nobody tested.
#
# The stamp is the release version, not a CI-only string, because the
# version has to be in the bytes before the digest exists -- promotion moves
# the tested digest to the version tag and never rebuilds. scripts/release-
# version.sh is the only place that string is decided.
build:images:
  stage: test
  image: docker:29-cli
  <<: *gate
  needs: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # bash for scripts/release-version.sh; docker:29-cli ships busybox ash.
    - apk add --no-cache bash >/dev/null
  script:
    # Build images from earlier pipelines are pruned here rather than in an
    # after_script somewhere: a later job cannot know whether the pipeline
    # still needs them, and a cancelled pipeline never reaches its cleanup
    # at all. Matching on the name and excluding this pipeline's own tag is
    # self-healing -- whatever was left behind goes on the next run.
    - |
      set -eu
      for repo in birdcage-build mockingbird-build; do
        docker image ls --format '{{.Repository}}:{{.Tag}}' "$repo" \
          | grep -v ":${CI_PIPELINE_ID}$" \
          | xargs -r docker image rm --force >/dev/null 2>&1 || true
      done
    - |
      set -eu
      stamp="$(scripts/release-version.sh --stamp "$CI_COMMIT_SHA")"
      echo "building both images as $stamp"
      birdcage_image="birdcage-build:${CI_PIPELINE_ID}"
      mockingbird_image="mockingbird-build:${CI_PIPELINE_ID}"
      docker build --build-arg VERSION="$stamp" \
        --file build/birdcage/Dockerfile --tag "$birdcage_image" .
      docker build --build-arg VERSION="$stamp" \
        --file build/mockingbird/Dockerfile --tag "$mockingbird_image" .
      # The config ID is the identity later jobs check back against. It is
      # not the registry digest -- that only exists once something is pushed
      # -- but it is what makes "the image I tested" and "the image I am
      # pushing" the same statement.
      birdcage_id="$(docker image inspect --format '{{.Id}}' "$birdcage_image")"
      mockingbird_id="$(docker image inspect --format '{{.Id}}' "$mockingbird_image")"
      {
        echo "BIRDCAGE_STAMP=$stamp"
        echo "BIRDCAGE_BUILD_IMAGE=$birdcage_image"
        echo "MOCKINGBIRD_BUILD_IMAGE=$mockingbird_image"
        echo "BIRDCAGE_BUILD_ID=$birdcage_id"
        echo "MOCKINGBIRD_BUILD_ID=$mockingbird_id"
      } > release.env
      cat release.env
  artifacts:
    # dotenv rather than files: these are five short strings every later job
    # needs as variables, and none of them is worth a download.
    reports:
      dotenv: release.env
    expire_in: 1 day

test:image:birdcage:
  stage: test
  image: docker:29-cli
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: birdcage-test-$CI_JOB_ID
  script:
    # The image under test is the one build:images produced, not a fresh
    # build of the same source -- see that job's header for why that
    # distinction is the whole point. Tagged under this job's own name so
    # the after_script below can clean up without touching the shared build
    # tag the release jobs still need.
    - docker tag "$BIRDCAGE_BUILD_IMAGE" "$APP"
    # #90: the release job stamps the version into the binary and compares
    # it back, so the stamping itself is proved here rather than at a
    # release nobody can retry. An image whose VERSION argument is silently
    # ignored still starts and still serves, so only asking it wins.
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    - >-
      docker run --detach --name "$APP"
      --env BIRDCAGE_HTTP_ADDR=127.0.0.1:8080
      --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
      --tmpfs /var/lib/birdcage:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 64 --memory 256m --cpus 0.5
      "$APP"
    - |
      for attempt in $(seq 1 20); do
        if docker run --rm --network "container:$APP" alpine:3.24 \
             wget -q -O - http://127.0.0.1:8080/api/alerts 2>/dev/null | grep -q '"alerts"'; then
          echo "/api/alerts answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 20 ]; then
          echo "/api/alerts never answered; container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
  after_script:
    - docker rm --force "birdcage-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker image rm "birdcage-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# The agent fails closed without a token and client certificate in its
# state directory, so the job mints throwaway ones into a named volume
# (never into the repository) and points MOCKINGBIRD_BIRDCAGE_URL at a closed
# port: what is under test is that the image starts as uid 65532, binds
# the honeypot ports, and answers an FTP client. The loopback path from
# OpenCanary to the agent is #48's end-to-end test, not this job's.
test:image:mockingbird:
  stage: test
  image: docker:29-cli
  <<: *gate
  needs:
    - job: build:images
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: mockingbird-test-$CI_JOB_ID
  script:
    # As in test:image:birdcage: the image under test is the one
    # build:images produced, so the bytes that answer these checks are the
    # bytes release:push publishes.
    - docker tag "$MOCKINGBIRD_BUILD_IMAGE" "$APP"
    # #97, matching test:image:birdcage's own check (#90): the stamping is
    # proved here rather than at a release nobody can retry. An image whose
    # VERSION argument is silently ignored still starts and still serves,
    # so only asking it wins.
    - |
      got="$(docker run --rm "$APP" version)"
      want="$BIRDCAGE_STAMP"
      if [ "$got" != "$want" ]; then
        echo "binary reports '$got', expected '$want'"
        exit 1
      fi
      echo "version stamped: $got"
    - docker volume create "$APP-state" >/dev/null
    - >-
      docker run --rm --volume "$APP-state:/s" alpine:3.24 sh -c '
      apk add --no-cache openssl >/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/ca-key.pem -out /s/ca.pem -days 1 -subj /CN=ci-throwaway-ca 2>/dev/null &&
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -keyout /s/client-key.pem -out /s/client.pem -days 1 -subj /CN=ci-throwaway-client 2>/dev/null &&
      rm /s/ca-key.pem && echo ci-throwaway-token > /s/token &&
      chown -R 65532:65532 /s && chmod 600 /s/*'
    # --cap-add NET_RAW is the capability the port-scan detector needs
    # (#65). It has no effect alongside --security-opt no-new-privileges,
    # which makes the kernel ignore the binary's file capability, so this
    # job's container reports port-scan detection off. That is deliberate:
    # this job exists to prove nothing in the image runs as root, and
    # relaxing its hardening to exercise a different feature would cost
    # more than it proves. The capability itself is proved by the image
    # test in #65 and by the unit tests in internal/agent/portscan.
    - >-
      docker run --detach --name "$APP" --init
      --sysctl net.ipv4.ip_unprivileged_port_start=0
      --volume "$APP-state:/var/lib/mockingbird"
      --tmpfs /var/log/opencanary:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      --tmpfs /var/tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
      --read-only --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges
      --pids-limit 64 --memory 256m --cpus 0.5
      --env MOCKINGBIRD_BIRDCAGE_URL=https://127.0.0.1:1
      "$APP"
    - |
      # The `sleep 2` is the point (#77). BusyBox nc shuts the socket
      # down for writing the moment its stdin ends, and can exit without
      # draining what the server already sent -- so `printf | nc` races
      # the server's replies rather than waiting for them. It won that
      # race on a workstation and lost it 26 times running on this
      # runner, where the container is held to half a CPU: OpenCanary
      # logged an authentication for nearly every attempt, proving it had
      # sent its 220 greeting, while the check reported no answer at all.
      # Holding stdin open until the replies arrive is what makes this a
      # readiness check rather than a timing measurement.
      #
      # Still assert the banner, not just that the port accepts a
      # connection: this job exists to prove OpenCanary is serving FTP,
      # and a bare connect would pass against a socket with nothing
      # behind it.
      for attempt in $(seq 1 30); do
        reply=$(docker run --rm --network "container:$APP" alpine:3.24 \
                  sh -c '{ printf "USER x\r\nPASS y\r\nQUIT\r\n"; sleep 2; } | nc -w 5 127.0.0.1 21' || true)
        if printf '%s' "$reply" | grep -q '^220 '; then
          echo "FTP answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 30 ]; then
          # Say which half failed. "Never answered" sent the last
          # investigation to the honeypot, which was working the whole
          # time; the check was what broke.
          if [ -n "$reply" ]; then
            echo "FTP replied but never sent a 220 greeting. Last reply:"
            printf '%s\n' "$reply"
          else
            echo "FTP sent nothing at all -- no connection, or no reply within the timeout."
          fi
          echo "container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    # Every process in the container -- docker-init, the agent, twistd --
    # must be uid 65532; a root process here is the failure the image
    # exists to prevent.
    - docker top "$APP" -o pid,user,args
    - docker top "$APP" -o pid,user,args | grep -q ' 65532 .*python3' || { echo "OpenCanary is not running as 65532"; exit 1; }
    - docker top "$APP" -o pid,user,args | awk 'NR > 1 && $2 != "65532" { bad = 1; print "not 65532:", $0 } END { exit bad }'
  after_script:
    - docker rm --force "mockingbird-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker volume rm "mockingbird-test-$CI_JOB_ID-state" >/dev/null 2>&1 || true
    - docker image rm "mockingbird-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# ---------------------------------------------------------------------------
# E2E -- the real stack, deployed and exercised (#78). Where the two
# test:image:* jobs above prove each image starts and stays unprivileged
# on its own, this stage puts them together: birdcage serving real TLS,
# a canary enrolled by the very `docker run` command the product printed,
# and a real hit travelling from OpenCanary to the dashboard's API.
# AGENTS.md's "Live testing is not optional" is what this stage is for.
#
# Everything lives in scripts/e2e/ rather than here, so the same run
# happens on a workstation -- which is how anyone debugs a red job:
#
#     eval "$(scripts/e2e/stack.sh up)"
#     scripts/e2e/enrol-and-hit.sh
#     scripts/e2e/stack.sh logs
#     scripts/e2e/stack.sh down
#
# With neither override set, `up` builds both images from scratch, same
# as always -- a workstation debugging a red job has no build:images run
# to hand it images. In CI (#98), E2E_BIRDCAGE_IMAGE and
# E2E_MOCKINGBIRD_IMAGE below point stack.sh at the tags build:images
# already built, so the journey tests those bytes instead of building a
# second copy of the same source.
#
# Adding a journey (#79 port scan, #80 mail, #81 dashboard) is a job of
# the same four lines with a different script name; the stack it needs
# is already stood up by stack.sh.
#
# E2E_PREFIX names every container, volume, network and image tag the
# run creates, so parallel pipelines never collide -- the same reason
# the test:image:* jobs above carry $CI_JOB_ID -- and so after_script
# can clean up a job that failed or was cancelled. Nothing is left
# behind either way.
e2e:enrol-and-hit:
  stage: e2e
  image: docker:29-cli
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Runs four containers at once, using the images build:images already
  # built; the light lane's 4 CPU / 6 GB is not enough headroom for that.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only.
    - apk add --no-cache bash >/dev/null
  script:
    - eval "$(scripts/e2e/stack.sh up)"
    - scripts/e2e/enrol-and-hit.sh
    - scripts/e2e/refusals.sh
  after_script:
    - scripts/e2e/stack.sh down

# The same journeys against the other engine birdcage ships. Separate
