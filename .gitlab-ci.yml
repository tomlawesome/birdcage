    - scripts/e2e/portscan-stack.sh down
    - scripts/e2e/stack.sh down

# Issue #86's poisoner, caught by the tool it exists to catch: real
# Responder, in a sibling container on the canary's own network, answering
# a real canary's real bait lookups. Sits at hop 1 for the same reason
# e2e:portscan does -- the encoders and the sockets only prove anything
# against the real image, and running Responder against them is what found
# an mDNS parser that dropped every real answer (RFC 6762 forbids a
# question section in a response) and a MAC missing from the first hit.
# Neither showed up in any unit test.
#
# It also asserts the half that needs the real attacker: Responder stands
# up the SMB and HTTP servers a poisoned victim would authenticate to, and
# logs every client that reaches them. "The canary never connected to the
# offered address" is therefore checked from the attacker's own side of the
# wire, which is the only place that could disagree with our code.
e2e:poisoner:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Four containers at once (birdcage, the base canary, this journey's own
  # canary and Responder), and Responder is a Python process that binds a
  # dozen sockets; the light lane's 4 CPU / 6 GB is not enough headroom.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-poisoner-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
    # The poisoner fixture. Attack tooling is never built in this
    # repository (its mirror is public): the private fixtures project
    # builds, scans and publishes it, and this pin is the whole of what
    # lives here (AGENTS.md, "Attack-tool fixtures"). Moving the pin is
    # the version check -- a one-line change, not a rebuild per pipeline.
    # The pull uses this job's token, so the fixtures project must list
    # this project under its job-token permissions (#127).
    E2E_POISONER_FIXTURE_IMAGE: poisoner-fixture:pinned
    # Responder v3.2.2.0, built and published once in the private fixtures
    # project (#127). Move this digest to move the version -- the check.
    E2E_POISONER_FIXTURE_DIGEST: registry.tomlawson.io/ai/birdcage-fixtures/poisoner-fixture@sha256:d57449276d70bd1209888c43d8bac274c7b50563fc8d85ad5498ed90ea7c7033
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only.
    - apk add --no-cache bash >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - eval "$(scripts/e2e/stack.sh up)"
    # The poisoner fixture is pulled by digest from the fixtures project
    # and tagged for the harness -- the same recovery pull the two build
    # images get above, which also does the registry login.
    - scripts/ci-ensure-image.sh "$E2E_POISONER_FIXTURE_IMAGE" "$E2E_POISONER_FIXTURE_DIGEST"
    - eval "$(scripts/e2e/poisoner-stack.sh up)"
    - scripts/e2e/poisoner.sh
    # Issue #124: reuses this same canary and fixture -- poisoner.sh has
    # already proved the canary is baiting; this pushes a live settings
    # change to it and proves the change reaches the running container,
    # with no restart, rather than standing up a second four-container
    # stack to prove the same push in isolation.
    - scripts/e2e/agent-settings.sh
  after_script:
    # poisoner-stack.sh down first: it removes containers attached to the
    # network stack.sh down is about to remove, the same ordering
    # e2e:portscan's own after_script keeps.
    - scripts/e2e/poisoner-stack.sh down
    - scripts/e2e/stack.sh down

# ADR-0014 (#4): the real `birdcage crowdsec add` against a real CrowdSec
# Local API -- the official image pinned by digest in
# scripts/e2e/crowdsec-stack.sh, LAPI-only, over TLS from a throwaway
# CA, with a password machine registered for birdcage the way an
# operator registers one. The journey (scripts/e2e/crowdsec.sh) asks
# CrowdSec itself what it holds after every step, and proves each
# refusal -- the floor, CrowdSec's own allowlist, a wrong CA, an http://
# URL, a wrong password -- leaves nothing on the LAPI and a row in
# audit_log. A unit test against a fake LAPI can only agree with our own
# reading of the API; this is the check that can disagree with it.
e2e:crowdsec:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *gate
  # build:images' dotenv names the tags this job points stack.sh at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Runs the LAPI container beside the base stack's; the light lane's
  # 4 CPU / 6 GB is not enough headroom for that.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-crowdsec-$CI_JOB_ID
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
    # The fixture is pulled through the dependency proxy (#128), by the
    # digest the stack script holds.
    E2E_REGISTRY_PREFIX: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only. jq reads cscli's
    # JSON on this host (scripts/e2e/crowdsec.sh says why).
    - apk add --no-cache bash jq >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - eval "$(scripts/e2e/stack.sh up)"
    - eval "$(scripts/e2e/crowdsec-stack.sh up)"
    - scripts/e2e/crowdsec.sh
  after_script:
    # crowdsec-stack.sh down first, for the reason e2e:mail gives: it
    # removes a container attached to the network stack.sh down is about
    # to remove.
    - scripts/e2e/crowdsec-stack.sh down
    - scripts/e2e/stack.sh down

