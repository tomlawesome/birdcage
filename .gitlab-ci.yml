# ---------------------------------------------------------------------------
# SYNC -- mirror the three delivery branches to GitHub after a merge.
# `needs: []`: the mirror reflects the branch, not the pipeline. Never
# --force: a non-fast-forward refusal means something wrote to GitHub's
# copy and the branch has forked; reconcile by merge.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# RELEASE (#90) -- build once, judge, then ship what was judged.
#
# The house rule this stage exists to obey: NO JOB BOTH JUDGES AN ARTEFACT
# AND SHIPS IT. So the work is split four ways, and scripts/ci-release-guard.py
# fails the pipeline if the split is ever quietly undone:
#
#   release:push     publishes the immutable anchor tag `sha-<commit>` and
#                    proves the registry now holds the bytes that were
#                    tested. Holds a registry credential; holds no key.
#   release:attest   mints the validation evidence over that digest. The
#                    ONLY job that can sign, and the fence is the runner,
#                    not this file: the `birdcage-signing` runner is
#                    protected and locked to this project, and its host
#                    mounts the owner-held key read-only. A job without the
#                    tag never sees the key. This GitLab is CE, which has no
#                    protected environments, so a CI/CD variable would be
#                    readable by every job on a protected branch -- which is
#                    why the key is not one.
#   release:preview  verifies that evidence and only then gives the digest a
#                    consumer-visible name. Verifying and signing are
#                    different jobs by design.
#   release:promote  moves the exact tested digest to the version tag. Never
#                    rebuilds, refuses an existing version tag, and refuses
#                    unless the evidence still stands.
#
# WHAT AUTHORISES A RELEASE (#99). One manual job on `main`, and the press
# is the instruction. It is not the approval click #90 rules out: that rule
# keeps human judgement from standing between evidence and publication,
# and every judging job on `preview` stays automatic. `release:promote`
# then validates rather than trusts -- the commit must carry an anchor from
# a validated build, the evidence must verify, the image must report the
# version, and the registry must not already hold it. The tag is created
# from VERSION afterwards, so there is nothing to type and nothing to
# mistype.
#
# WHAT THE EVIDENCE DOES AND DOES NOT SAY. It binds a digest to a commit and
# to the policy version that judged it. The image checks and the live
# journeys ran on that commit; the `test:image:*` jobs and, since #98, the
# `e2e:*` journeys that use scripts/e2e/stack.sh all run on these exact
# bytes (build:images) -- see docs/releasing.md for the one job that is
# still its own build and why. That is what makes "validated" mean the
# bytes that ship, not a second build of the same source.
# ---------------------------------------------------------------------------

# Every release job needs the same two things: a shell the scripts are
# written for, and the registry credential. Nothing here is a key.
.ghcr_login: &ghcr_login
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is not set -- is this ref protected?"; exit 1; }
    - test -n "$GHCR_USER" || { echo "GHCR_USER is not set -- is this ref protected?"; exit 1; }
    - echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

release:push:
  stage: release
  image: docker:29-cli
  # A cancelled publish leaves a pushed digest with no evidence, or a commit
  # that can never be released because its anchor half-exists. The next push
  # must not cancel this one.
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  # No `needs:` on purpose. Without one, GitLab holds this job until every
  # job in every earlier stage has succeeded -- which is exactly the bar for
  # publishing -- and it still inherits build:images' dotenv. Listing jobs
  # here would be a second copy of the gate, free to fall out of step with
  # the real one.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *ghcr_login
  script:
    - |
      set -eu
      mkdir -p .birdcage-release
      # Refuse before publishing anything if this version has already been
      # released (#99). The check belongs here, not at promotion: a preview
      # build stamped with a version that has already shipped is claiming
      # candidacy for a release that has closed, and catching that days
      # later at the cut means days of preview builds nobody can release.
      released="$(scripts/release-version.sh --tag)"
      if docker buildx imagetools inspect "${GHCR_BIRDCAGE_REPO}:${released}" >/dev/null 2>&1; then
        echo "${GHCR_BIRDCAGE_REPO}:${released} already exists -- $released has been released."
        echo "Bump VERSION before merging anything else to preview."
        exit 1
      fi
      anchor="sha-${CI_COMMIT_SHA}"
      # Only the anchor is pushed here. It is immutable by construction (a
      # commit sha names one build) and it is never what a user pulls: the
      # channel name is release:preview's to create, after the evidence has
      # been judged. The anchor exists at all because an untagged manifest
      # is rubbish to a registry's garbage collector -- it can be deleted
      # inside its own evidence window by routine maintenance.
      docker tag "$BIRDCAGE_BUILD_IMAGE" "${GHCR_BIRDCAGE_REPO}:${anchor}"
      docker tag "$MOCKINGBIRD_BUILD_IMAGE" "${GHCR_MOCKINGBIRD_REPO}:${anchor}"
      # The second argument is the config ID build:images recorded, so this
      # refuses if what is in the local daemon is not what was tested --
      # which is also what would happen if a second runner host ever meant
      # "the same pipeline" no longer implied "the same daemon".
      birdcage_digest="$(scripts/publish-image.sh "${GHCR_BIRDCAGE_REPO}:${anchor}" "$BIRDCAGE_BUILD_ID")"
      mockingbird_digest="$(scripts/publish-image.sh "${GHCR_MOCKINGBIRD_REPO}:${anchor}" "$MOCKINGBIRD_BUILD_ID")"
      # Passed on as plain variables rather than parsed back out of JSON:
      # docker:29-cli has no python and no jq, and a digest read wrongly is
      # a digest published wrongly. GHCR_-prefixed on purpose -- a variable
      # called BIRDCAGE_DIGEST would be inherited by every later job and
      # silently answer for scripts/verify-validation-evidence.sh, which
      # reads exactly that name.
      {
        echo "GHCR_BIRDCAGE_DIGEST=$birdcage_digest"
        echo "GHCR_MOCKINGBIRD_DIGEST=$mockingbird_digest"
      } > digests.env
      cat digests.env
      # The durable record of what this pipeline published, kept for 90
      # days as the thing to read when asking "where did this digest come
      # from" long after the dotenv has expired.
      printf '%s\n' \
        '{' \
        "  \"commit\": \"${CI_COMMIT_SHA}\"," \
        "  \"ref\": \"${CI_COMMIT_REF_NAME}\"," \
        "  \"pipelineId\": \"${CI_PIPELINE_ID}\"," \
        "  \"stamp\": \"${BIRDCAGE_STAMP}\"," \
        '  "images": {' \
        "    \"birdcage\": { \"repository\": \"${GHCR_BIRDCAGE_REPO}\", \"digest\": \"${birdcage_digest}\" }," \
        "    \"mockingbird\": { \"repository\": \"${GHCR_MOCKINGBIRD_REPO}\", \"digest\": \"${mockingbird_digest}\" }" \
        '  }' \
        '}' > .birdcage-release/tested-images.json
      cat .birdcage-release/tested-images.json
  artifacts:
    name: birdcage-tested-images
    paths:
      - .birdcage-release/tested-images.json
    reports:
      dotenv: digests.env
    expire_in: 90 days
    when: on_success

# The only job that may sign. Deliberately tiny: the pinned cosign binary
# and this repository's own scripts, and no image build, no test suite and
# no publication anywhere near the key.
#
# No DOCKER_HOST and no daemon: `docker login` writes the credential file
# without one, and cosign talks to the registry over HTTPS itself.
release:attest:
  stage: release
  image: docker:29-cli
  interruptible: false
  tags: [birdcage-signing]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  needs:
    - job: release:push
      artifacts: true
  <<: *ghcr_login
  script:
    - |
      set -eu
      for pair in "${GHCR_BIRDCAGE_REPO}|${GHCR_BIRDCAGE_DIGEST}" "${GHCR_MOCKINGBIRD_REPO}|${GHCR_MOCKINGBIRD_DIGEST}"; do
        repo="${pair%|*}"
        digest="${pair#*|}"
        echo "attesting $repo@$digest"
        BIRDCAGE_SIGNING_DIR="${BIRDCAGE_SIGNING_DIR:-/etc/birdcage-signing}" \
          scripts/attest-tested-image.sh "${repo}@${digest}" "$digest"
      done

release:preview:
  stage: release
  image: docker:29-cli
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  needs:
    - job: release:push
      artifacts: true
    - job: release:attest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *ghcr_login
  script:
    - |
      set -eu
      for pair in "${GHCR_BIRDCAGE_REPO}|${GHCR_BIRDCAGE_DIGEST}" "${GHCR_MOCKINGBIRD_REPO}|${GHCR_MOCKINGBIRD_DIGEST}"; do
        repo="${pair%|*}"
        digest="${pair#*|}"
        BIRDCAGE_COMMIT="$CI_COMMIT_SHA" BIRDCAGE_REF="$CI_COMMIT_REF_NAME" \
          scripts/publish-channel.sh "$repo" "$digest" preview
      done

# Promotion. One manual job on `main` -- the single button that cuts a
# release (#99). Nothing here decides that a release should happen: the
# press is the owner's instruction, and everything the button then does is
# a refusal or a registry-side copy.
#
# This is not the approval click #90 rules out. That rule keeps human
# judgement from standing between evidence and publication, pretending to
# be evidence: every judging job on `preview` stays automatic and the
# evidence is minted without anyone's say-so. Authorisation was always
# human -- it used to be three typed git commands, and a button is the same
# instruction with fewer things to mistype. It runs on the pipeline of the
# exact `main` commit shown in the UI, so it cannot pick the wrong commit
# or invent a version, and GitLab records who pressed it.
#
# The tag is an OUTPUT, not an input: release:gitlab below creates it from
# VERSION once the digest has actually moved. So there is no tag to check
# against VERSION here -- that failure mode is removed rather than guarded.
#
# Which commit's build is being released: the tag names a commit on `main`,
# and the anchor was pushed for the commit on `preview`. If `main` fast-
# forwarded they are the same commit; if the merge made a merge commit, the
# preview head is its second parent. Both candidates are tried and the first
# with an anchor wins -- and it is not a guess, because the evidence binds
# the commit: promoting the wrong one fails the verifier rather than
# shipping. Anything else refuses and says which two it looked at.
release:promote:
  stage: release
  image: docker:29-cli
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
      # A manual job is allow_failure by default, and forcing it false
      # would leave every `main` pipeline reading "blocked" forever waiting
      # for a release nobody intends to cut yet. Safe here for the reason
      # scripts/ci-release-guard.py names: the silent-green failure that
      # rule prevents cannot happen to a job a human is watching, because
      # they just pressed it.
      allow_failure: true
  # No `needs:` here either, for release:push's reason: without one the
  # button does not become playable until every job in every earlier stage
  # of `main`'s own pipeline has passed. Cutting a release while the gate
  # on `main` is red should not be one click away.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # The second parent has to be reachable for the fallback above.
    GIT_DEPTH: 0
  <<: *ghcr_login
  script:
    - apk add --no-cache git >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      set -eu
      head="$(git rev-parse HEAD)"
      second="$(git rev-parse --verify --quiet 'HEAD^2' || true)"
      for candidate in "$head" $second; do
        if docker buildx imagetools inspect \
             "${GHCR_BIRDCAGE_REPO}:sha-${candidate}" >/dev/null 2>&1; then
          echo "$candidate" > .release-commit
          break
        fi
      done
      if [ ! -s .release-commit ]; then
        echo "no validated build was published for $head${second:+ or $second}."
        echo "A release can only promote a digest that went through preview."
        exit 1
      fi
      echo "promoting the build of $(cat .release-commit)"
    - |
      set -eu
      commit="$(cat .release-commit)"
      # --expect-stamp for both images (#97): each now has a `version`
      # command to ask, so promotion proves the released bytes carry the
      # released version for birdcage and mockingbird alike.
      birdcage_digest="$(scripts/promote-release.sh --expect-stamp "$GHCR_BIRDCAGE_REPO" "$commit")"
      mockingbird_digest="$(scripts/promote-release.sh --expect-stamp "$GHCR_MOCKINGBIRD_REPO" "$commit")"
      # `latest` moves on every release, pre-release or not. Whether a
      # beta is the right thing to run is the decision of whoever pulls it,
      # not this pipeline's.
      #
      # What this pipeline is responsible for is narrower, and is met:
      # `latest` cannot point at an unapproved build. It is moved through
      # publish-channel.sh -- the same code that creates the `preview` tag
      # -- which re-verifies the validation evidence before it moves any
      # name at all. Nobody moves it by hand. A tag that moves is not a
      # weaker promise when the moving is gated.
      for pair in "${GHCR_BIRDCAGE_REPO}|${birdcage_digest}" "${GHCR_MOCKINGBIRD_REPO}|${mockingbird_digest}"; do
        BIRDCAGE_COMMIT="$commit" \
          scripts/publish-channel.sh "${pair%|*}" "${pair#*|}" latest
      done
      # The tag release:gitlab will create, decided here so one job reads
      # VERSION and the other cannot disagree with it.
      {
        echo "RELEASE_TAG=$(scripts/release-version.sh --tag)"
        echo "RELEASE_COMMIT=$commit"
      } > promotion.env
      cat promotion.env
  artifacts:
    reports:
      dotenv: promotion.env
    expire_in: 90 days

# The annotated tag and the release note, created together once the digest
# has actually moved. The order matters: promote first, name second. If
# promotion refuses, nothing anywhere carries the version's name; if this
# job fails after a good promotion it can be retried on its own, without
# re-promoting, so a version is never burnt by a half-finished cut.
#
# release-cli creates the tag from `ref` using CI_JOB_TOKEN, which acts
# with the permissions of whoever pressed the button -- so a protected `v*`
# tag is created when the owner cuts the release and refused when someone
# without that right tries.
#
# Separate job because the `release:` keyword needs release-cli in the
# image, and because it must not be able to run unless the promotion
# succeeded: a release note pointing at images that were never promoted is
# worse than none.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  needs:
    - job: release:promote
      artifacts: true
  script:
    - echo "tagging $RELEASE_COMMIT as $RELEASE_TAG"
  release:
    tag_name: $RELEASE_TAG
    tag_message: birdcage $RELEASE_TAG
    ref: $CI_COMMIT_SHA
    name: $RELEASE_TAG
    description: |
      Images published by digest, promoted from the build `preview` tested:

      - `$GHCR_BIRDCAGE_REPO:$RELEASE_TAG`
      - `$GHCR_MOCKINGBIRD_REPO:$RELEASE_TAG`

      Verify before you run either of them -- docs/releasing.md has the
      commands. Both carry a key-based validation attestation; the keyless
      countersignature is added by hand on GitHub after the cut.

sync:mirror-to-github:
  stage: sync
  image: alpine:3.24
  needs: []
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
      variables:
        MIRROR_REF: refs/heads/$CI_COMMIT_BRANCH
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && $CI_COMMIT_TAG =~ /^v[0-9]/'
      variables:
        MIRROR_REF: refs/tags/$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is ${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH} protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # GitLab's variable editor trims the key's final newline and OpenSSH
    # refuses a key without one; put it back, and prove the key loads
    # before trying GitHub -- without printing any of it.
    - tr -d '\r' < "$GITHUB_MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
    - '[ -n "$(tail -c1 ~/.ssh/mirror_key)" ] && echo >> ~/.ssh/mirror_key || true'
    - 'head -1 ~/.ssh/mirror_key | grep -q "PRIVATE KEY" || { echo "GITHUB_MIRROR_SSH_KEY does not begin with a PRIVATE KEY header"; exit 1; }'
    - 'ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null || { echo "GITHUB_MIRROR_SSH_KEY is not a readable private key"; exit 1; }'
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/birdcage.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/birdcage.git
    - git push github "HEAD:$MIRROR_REF"
