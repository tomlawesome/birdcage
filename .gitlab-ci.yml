# live run, and a storage-engine difference here would show up in how
# the receipt was written, not in how Nightjar scanned.
e2e:scanner:postgres:
  stage: e2e
  image: $DOCKER_CLI_IMAGE
  <<: *higher_bar
  # build:images' dotenv names the tags this job points the stack at
  # (#98), so the journey tests the bytes that would ship, not a second
  # build of the same source.
  needs:
    - job: build:images
      artifacts: true
  # Fetches Grype's real vulnerability database (a couple of minutes)
  # and runs the base stack's four containers plus three Nightjar
  # instances in turn; the light lane's 4 CPU / 6 GB is not enough
  # headroom for that.
  tags: [big]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    E2E_PREFIX: birdcage-e2e-scanner-pg-$CI_JOB_ID
    E2E_BACKEND: postgres
    E2E_BIRDCAGE_IMAGE: $BIRDCAGE_BUILD_IMAGE
    E2E_MOCKINGBIRD_IMAGE: $MOCKINGBIRD_BUILD_IMAGE
    E2E_OPENCANARY_IMAGE: $OPENCANARY_BUILD_IMAGE
    E2E_HOLDER_IMAGE: $HOLDER_BUILD_IMAGE
    E2E_NIGHTJAR_IMAGE: $NIGHTJAR_BUILD_IMAGE
  before_script:
    # The scripts are bash (arrays, and `set -u` around optional
    # variables); docker:29-cli ships busybox ash only. openssl is for
    # scripts/e2e/stack.sh's build_postgres_tls_image (#84), which builds
    # the one-line derived Postgres image this backend needs.
    - apk add --no-cache bash openssl >/dev/null
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    # A concurrent pipeline's build:images may have pruned one of these
    # local tags between when it was built and now (#112) -- this recovers
    # it from the registry if so, and does nothing if it is still there.
    - scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
    - scripts/ci-ensure-image.sh "$NIGHTJAR_BUILD_IMAGE" "$NIGHTJAR_BUILD_DIGEST"
    - eval "$(scripts/e2e/stack.sh up)"
    - eval "$(scripts/e2e/scanner-stack.sh up)"
    - scripts/e2e/scanner.sh
  after_script:
    - scripts/e2e/scanner-stack.sh down
    - scripts/e2e/stack.sh down

# ---------------------------------------------------------------------------
# SYNC -- mirror the three delivery branches to GitHub after a merge.
# `needs: []`: the mirror reflects the branch, not the pipeline. Never
# --force: a non-fast-forward refusal means something wrote to GitHub's
# copy and the branch has forked; reconcile by merge.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# RELEASE (#90) -- build once, judge, then ship what was judged.
#
# The house rule this stage exists to obey: NO JOB BOTH JUDGES AN ARTEFACT
# AND SHIPS IT. So the work is split four ways, and scripts/ci-release-guard.py
# fails the pipeline if the split is ever quietly undone:
#
#   release:push     publishes the immutable anchor tag `sha-<commit>` and
#                    proves the registry now holds the bytes that were
#                    tested. Holds a registry credential; holds no key.
#   release:attest   mints the validation evidence over that digest. The
#                    ONLY job that can sign, and the fence is the runner,
#                    not this file: the `birdcage-signing` runner is
#                    protected and locked to this project, and its host
#                    mounts the owner-held key read-only. A job without the
#                    tag never sees the key. This GitLab is CE, which has no
#                    protected environments, so a CI/CD variable would be
#                    readable by every job on a protected branch -- which is
#                    why the key is not one.
#   release:preview  verifies that evidence and only then gives the digest a
#                    consumer-visible name. Verifying and signing are
#                    different jobs by design.
#   release:promote  moves the exact tested digest to the version tag. Never
#                    rebuilds, refuses an existing version tag, and refuses
#                    unless the evidence still stands.
#
# WHAT AUTHORISES A RELEASE (#99). One manual job on `main`, and the press
# is the instruction. It is not the approval click #90 rules out: that rule
# keeps human judgement from standing between evidence and publication,
# and every judging job on `preview` stays automatic. `release:promote`
# then validates rather than trusts -- the commit must carry an anchor from
# a validated build, the evidence must verify, the image must report the
# version, and the registry must not already hold it. The tag is created
# from VERSION afterwards, so there is nothing to type and nothing to
# mistype.
#
# WHAT THE EVIDENCE DOES AND DOES NOT SAY. It binds a digest to a commit and
# to the policy version that judged it. The image checks and the live
# journeys ran on that commit; the `test:image:*` jobs and, since #98, the
# `e2e:*` journeys that use scripts/e2e/stack.sh all run on these exact
# bytes (build:images) -- see docs/releasing.md for the one job that is
# still its own build and why. That is what makes "validated" mean the
# bytes that ship, not a second build of the same source.
# ---------------------------------------------------------------------------

# Every release job needs the same two things: the tools the scripts are
# written for, and the registry credential. Nothing here is a key. The
# credential is the job token GitLab already gives every job -- no CI/CD
# variable to set, no owner setup, and it is scoped to this project only.
# The tools are RELEASE_APK_PACKAGES, which test:release-scripts installs
# too, so a tool missing here fails a merge request, not a release (#158:
# python3 was missing and the first real run stopped at release:preview).
.registry_login: &registry_login
  before_script:
    - apk add --no-cache $RELEASE_APK_PACKAGES >/dev/null
    - test -n "$CI_REGISTRY_PASSWORD" || { echo "CI_REGISTRY_PASSWORD is not set -- the job token should always carry this"; exit 1; }
    - test -n "$CI_REGISTRY_USER" || { echo "CI_REGISTRY_USER is not set -- the job token should always carry this"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

# The mirror jobs' credential: read access to the GitLab registry (the job
# token, same as every other release job) plus write access to GHCR, scoped
# to the push alone (note 22233). Nobody else in the release stage needs
# GHCR_TOKEN -- every judging and GitLab-shipping job stays on
# *registry_login only, so a compromise of this credential can, at worst,
# push a copy of an already-published digest under its own already-public
# tag; it cannot mint evidence or move a GitLab tag.
.mirror_login: &mirror_login
  before_script:
    - apk add --no-cache bash >/dev/null
    - test -n "$CI_REGISTRY_PASSWORD" || { echo "CI_REGISTRY_PASSWORD is not set -- the job token should always carry this"; exit 1; }
    - test -n "$CI_REGISTRY_USER" || { echo "CI_REGISTRY_USER is not set -- the job token should always carry this"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is not set -- is this ref protected?"; exit 1; }
    - test -n "$GHCR_USER" || { echo "GHCR_USER is not set -- is this ref protected?"; exit 1; }
    - echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

release:push:
  stage: release
  image: $DOCKER_CLI_IMAGE
  # A cancelled publish leaves a pushed digest with no evidence, or a commit
  # that can never be released because its anchor half-exists. The next push
  # must not cancel this one.
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  # No `needs:` on purpose. Without one, GitLab holds this job until every
  # job in every earlier stage has succeeded -- which is exactly the bar for
  # publishing -- and it still inherits build:images' dotenv. Listing jobs
  # here would be a second copy of the gate, free to fall out of step with
  # the real one.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *registry_login
  script:
    - |
      set -eu
      mkdir -p .birdcage-release
      # Refuse before publishing anything if this version has already been
      # released (#99). The check belongs here, not at promotion: a preview
      # build stamped with a version that has already shipped is claiming
      # candidacy for a release that has closed, and catching that days
      # later at the cut means days of preview builds nobody can release.
      released="$(scripts/release-version.sh --tag)"
      if docker buildx imagetools inspect "${BIRDCAGE_RELEASE_REPO}:${released}" >/dev/null 2>&1; then
        echo "${BIRDCAGE_RELEASE_REPO}:${released} already exists -- $released has been released."
        echo "Bump VERSION before merging anything else to preview."
        exit 1
      fi
      anchor="sha-${CI_COMMIT_SHA}"
      # release:push has no `needs:`, so it waits for every earlier job --
      # the longest exposure window in the pipeline (#112) -- which means
      # the local tag build:images built is the most likely of anyone's to
      # have been pruned by a concurrent pipeline by the time this runs.
      # Recovers it from this project's own registry if so.
      scripts/ci-ensure-image.sh "$BIRDCAGE_BUILD_IMAGE" "$BIRDCAGE_BUILD_DIGEST"
      scripts/ci-ensure-image.sh "$MOCKINGBIRD_BUILD_IMAGE" "$MOCKINGBIRD_BUILD_DIGEST"
      scripts/ci-ensure-image.sh "$NIGHTJAR_BUILD_IMAGE" "$NIGHTJAR_BUILD_DIGEST"
      scripts/ci-ensure-image.sh "$SMB_LURE_BUILD_IMAGE" "$SMB_LURE_BUILD_DIGEST"
      scripts/ci-ensure-image.sh "$HOLDER_BUILD_IMAGE" "$HOLDER_BUILD_DIGEST"
      scripts/ci-ensure-image.sh "$OPENCANARY_BUILD_IMAGE" "$OPENCANARY_BUILD_DIGEST"
      # Only the anchor is pushed here. It is immutable by construction (a
      # commit sha names one build) and it is never what a user pulls: the
      # channel name is release:preview's to create, after the evidence has
      # been judged. The anchor exists at all because an untagged manifest
      # is rubbish to a registry's garbage collector -- it can be deleted
      # inside its own evidence window by routine maintenance.
      docker tag "$BIRDCAGE_BUILD_IMAGE" "${BIRDCAGE_RELEASE_REPO}:${anchor}"
      docker tag "$MOCKINGBIRD_BUILD_IMAGE" "${MOCKINGBIRD_RELEASE_REPO}:${anchor}"
      docker tag "$NIGHTJAR_BUILD_IMAGE" "${NIGHTJAR_RELEASE_REPO}:${anchor}"
      docker tag "$SMB_LURE_BUILD_IMAGE" "${SMB_LURE_RELEASE_REPO}:${anchor}"
      docker tag "$HOLDER_BUILD_IMAGE" "${HOLDER_RELEASE_REPO}:${anchor}"
      docker tag "$OPENCANARY_BUILD_IMAGE" "${OPENCANARY_RELEASE_REPO}:${anchor}"
      # The second argument is the config ID build:images recorded, so this
      # refuses if what is in the local daemon is not what was tested --
      # which is also what would happen if a second runner host ever meant
      # "the same pipeline" no longer implied "the same daemon".
      birdcage_digest="$(scripts/publish-image.sh "${BIRDCAGE_RELEASE_REPO}:${anchor}" "$BIRDCAGE_BUILD_ID")"
      mockingbird_digest="$(scripts/publish-image.sh "${MOCKINGBIRD_RELEASE_REPO}:${anchor}" "$MOCKINGBIRD_BUILD_ID")"
      nightjar_digest="$(scripts/publish-image.sh "${NIGHTJAR_RELEASE_REPO}:${anchor}" "$NIGHTJAR_BUILD_ID")"
      smb_lure_digest="$(scripts/publish-image.sh "${SMB_LURE_RELEASE_REPO}:${anchor}" "$SMB_LURE_BUILD_ID")"
      holder_digest="$(scripts/publish-image.sh "${HOLDER_RELEASE_REPO}:${anchor}" "$HOLDER_BUILD_ID")"
      opencanary_digest="$(scripts/publish-image.sh "${OPENCANARY_RELEASE_REPO}:${anchor}" "$OPENCANARY_BUILD_ID")"
      # Passed on as plain variables rather than parsed back out of JSON:
      # docker:29-cli has no python and no jq, and a digest read wrongly is
      # a digest published wrongly. RELEASE_-prefixed on purpose -- a variable
      # called BIRDCAGE_DIGEST would be inherited by every later job and
      # silently answer for scripts/verify-validation-evidence.sh, which
      # reads exactly that name.
      {
        echo "RELEASE_BIRDCAGE_DIGEST=$birdcage_digest"
        echo "RELEASE_MOCKINGBIRD_DIGEST=$mockingbird_digest"
        echo "RELEASE_NIGHTJAR_DIGEST=$nightjar_digest"
        echo "RELEASE_SMB_LURE_DIGEST=$smb_lure_digest"
        echo "RELEASE_HOLDER_DIGEST=$holder_digest"
        echo "RELEASE_OPENCANARY_DIGEST=$opencanary_digest"
      } > digests.env
      cat digests.env
      # The durable record of what this pipeline published, kept for 90
      # days as the thing to read when asking "where did this digest come
      # from" long after the dotenv has expired.
      printf '%s\n' \
        '{' \
        "  \"commit\": \"${CI_COMMIT_SHA}\"," \
        "  \"ref\": \"${CI_COMMIT_REF_NAME}\"," \
        "  \"pipelineId\": \"${CI_PIPELINE_ID}\"," \
        "  \"stamp\": \"${BIRDCAGE_STAMP}\"," \
        '  "images": {' \
        "    \"birdcage\": { \"repository\": \"${BIRDCAGE_RELEASE_REPO}\", \"digest\": \"${birdcage_digest}\" }," \
        "    \"mockingbird\": { \"repository\": \"${MOCKINGBIRD_RELEASE_REPO}\", \"digest\": \"${mockingbird_digest}\" }," \
        "    \"nightjar\": { \"repository\": \"${NIGHTJAR_RELEASE_REPO}\", \"digest\": \"${nightjar_digest}\" }," \
        "    \"smb-lure\": { \"repository\": \"${SMB_LURE_RELEASE_REPO}\", \"digest\": \"${smb_lure_digest}\" }," \
        "    \"holder\": { \"repository\": \"${HOLDER_RELEASE_REPO}\", \"digest\": \"${holder_digest}\" }," \
        "    \"opencanary\": { \"repository\": \"${OPENCANARY_RELEASE_REPO}\", \"digest\": \"${opencanary_digest}\" }" \
        '  }' \
        '}' > .birdcage-release/tested-images.json
      cat .birdcage-release/tested-images.json
  artifacts:
    name: birdcage-tested-images
    paths:
      - .birdcage-release/tested-images.json
    reports:
      dotenv: digests.env
    expire_in: 90 days
    when: on_success

# The only job that may sign. Deliberately tiny: the pinned cosign binary
# and this repository's own scripts, and no image build, no test suite and
# no publication anywhere near the key.
#
# No DOCKER_HOST and no daemon: `docker login` writes the credential file
# without one, and cosign talks to the registry over HTTPS itself.
release:attest:
  stage: release
  image: $DOCKER_CLI_IMAGE
  interruptible: false
  tags: [birdcage-signing]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  needs:
    - job: release:push
      artifacts: true
  <<: *registry_login
  script:
    - |
      set -eu
      for pair in "${BIRDCAGE_RELEASE_REPO}|${RELEASE_BIRDCAGE_DIGEST}" "${MOCKINGBIRD_RELEASE_REPO}|${RELEASE_MOCKINGBIRD_DIGEST}" "${NIGHTJAR_RELEASE_REPO}|${RELEASE_NIGHTJAR_DIGEST}" "${SMB_LURE_RELEASE_REPO}|${RELEASE_SMB_LURE_DIGEST}" "${HOLDER_RELEASE_REPO}|${RELEASE_HOLDER_DIGEST}" "${OPENCANARY_RELEASE_REPO}|${RELEASE_OPENCANARY_DIGEST}"; do
        repo="${pair%|*}"
        digest="${pair#*|}"
        echo "attesting $repo@$digest"
        BIRDCAGE_SIGNING_DIR="${BIRDCAGE_SIGNING_DIR:-/etc/birdcage-signing}" \
          scripts/attest-tested-image.sh "${repo}@${digest}" "$digest"
      done

release:preview:
  stage: release
  image: $DOCKER_CLI_IMAGE
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  needs:
    - job: release:push
      artifacts: true
    - job: release:attest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *registry_login
  script:
    - |
      set -eu
      for pair in "${BIRDCAGE_RELEASE_REPO}|${RELEASE_BIRDCAGE_DIGEST}" "${MOCKINGBIRD_RELEASE_REPO}|${RELEASE_MOCKINGBIRD_DIGEST}" "${NIGHTJAR_RELEASE_REPO}|${RELEASE_NIGHTJAR_DIGEST}" "${SMB_LURE_RELEASE_REPO}|${RELEASE_SMB_LURE_DIGEST}" "${HOLDER_RELEASE_REPO}|${RELEASE_HOLDER_DIGEST}" "${OPENCANARY_RELEASE_REPO}|${RELEASE_OPENCANARY_DIGEST}"; do
        repo="${pair%|*}"
        digest="${pair#*|}"
        BIRDCAGE_COMMIT="$CI_COMMIT_SHA" BIRDCAGE_REF="$CI_COMMIT_REF_NAME" \
          scripts/publish-channel.sh "$repo" "$digest" preview
      done

# Copies the `preview` tag release:preview just created to GHCR, the public
# download point (note 22233). This job never judges anything: the digest
# was already named by release:preview, which already verified the
# evidence, so scripts/mirror-image.sh only resolves what that tag now
# points at and copies it -- it does not call
# scripts/verify-validation-evidence.sh, and must not, or this would become
# a second job judging the same evidence rather than a copy of a decision
# already made. That is also why the release guard's "no job both judges
# and ships" rule does not apply here: there is no judging in this job to
# collide with the shipping.
#
# The cosign attestation release:attest minted is not part of the image
# manifest -- cosign v3 stores it as a Sigstore bundle attached as an OCI
# referrer, listed under the fallback tag `sha256-<digest-hex>` (no `.att`:
# that was cosign v2, #162). It has to be copied separately or the
# countersigning workflow finds an image on GHCR with no evidence next to
# it. Same script, because from mirror-image.sh's own point of view that
# index is just another tag to copy and verify.
#
# That tag is one index listing every referrer of the digest. Mirroring it
# again after the GitHub countersign has added its own bundle on GHCR would
# overwrite GHCR's index and drop the countersignature; the documented order
# (promote, then countersign) never does that.
#
# Deliberately not allow_failure and not manual: a failed mirror should
# turn the pipeline red so it gets noticed and retried, exactly like any
# other job here, but it cannot undo or block the GitLab publish that
# already happened -- release:push, release:attest and release:preview keep
# whatever result they already reached regardless of what this job does
# afterwards.
release:mirror-preview:
  stage: release
  image: $DOCKER_CLI_IMAGE
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"
  needs:
    - job: release:preview
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *mirror_login
  script:
    - |
      set -eu
      for pair in "${BIRDCAGE_RELEASE_REPO}|${BIRDCAGE_MIRROR_REPO}" "${MOCKINGBIRD_RELEASE_REPO}|${MOCKINGBIRD_MIRROR_REPO}" "${NIGHTJAR_RELEASE_REPO}|${NIGHTJAR_MIRROR_REPO}" "${SMB_LURE_RELEASE_REPO}|${SMB_LURE_MIRROR_REPO}" "${HOLDER_RELEASE_REPO}|${HOLDER_MIRROR_REPO}" "${OPENCANARY_RELEASE_REPO}|${OPENCANARY_MIRROR_REPO}"; do
        repo="${pair%|*}"
        mirror_repo="${pair#*|}"
        digest="$(scripts/mirror-image.sh "$repo" preview "$mirror_repo")"
        scripts/mirror-image.sh "$repo" "sha256-${digest#sha256:}" "$mirror_repo"
      done

# Promotion. One manual job on `main` -- the single button that cuts a
# release (#99). Nothing here decides that a release should happen: the
# press is the owner's instruction, and everything the button then does is
# a refusal or a registry-side copy.
#
# This is not the approval click #90 rules out. That rule keeps human
# judgement from standing between evidence and publication, pretending to
# be evidence: every judging job on `preview` stays automatic and the
# evidence is minted without anyone's say-so. Authorisation was always
# human -- it used to be three typed git commands, and a button is the same
# instruction with fewer things to mistype. It runs on the pipeline of the
# exact `main` commit shown in the UI, so it cannot pick the wrong commit
# or invent a version, and GitLab records who pressed it.
#
# The tag is an OUTPUT, not an input: release:gitlab below creates it from
# VERSION once the digest has actually moved. So there is no tag to check
# against VERSION here -- that failure mode is removed rather than guarded.
#
# Which commit's build is being released: the tag names a commit on `main`,
# and the anchor was pushed for the commit on `preview`. If `main` fast-
# forwarded they are the same commit; if the merge made a merge commit, the
# preview head is one of its parents -- an octopus merge has more than one.
# HEAD and every parent are tried and the first with an anchor wins -- and
# it is not a guess, because the evidence binds the commit: promoting the
# wrong one fails the verifier rather than shipping. Anything else refuses
# and says which candidates it looked at.
release:promote:
  stage: release
  image: $DOCKER_CLI_IMAGE
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
      # A manual job is allow_failure by default, and forcing it false
      # would leave every `main` pipeline reading "blocked" forever waiting
      # for a release nobody intends to cut yet. Safe here for the reason
      # scripts/ci-release-guard.py names: the silent-green failure that
      # rule prevents cannot happen to a job a human is watching, because
      # they just pressed it.
      allow_failure: true
  # No `needs:` here either, for release:push's reason: without one the
  # button does not become playable until every job in every earlier stage
  # of `main`'s own pipeline has passed. Cutting a release while the gate
  # on `main` is red should not be one click away.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Every parent has to be reachable for scripts/release-candidate.sh.
    GIT_DEPTH: 0
  <<: *registry_login
  script:
    - apk add --no-cache git >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      set -eu
      # HEAD, or the merged-in parent -- never the first parent, which is
      # main's previous tip (#154; scripts/release-candidate.sh says why).
      sh scripts/release-candidate.sh "$BIRDCAGE_RELEASE_REPO" > .release-commit
      echo "promoting the build of $(cat .release-commit)"
    - |
      set -eu
      commit="$(cat .release-commit)"
      # --expect-stamp (#97): each image has a `version` command to ask,
      # so promotion proves the released bytes carry the released version
      # for all six (smb-lure's since #125, holder's since #126,
      # opencanary's since #132).
      birdcage_digest="$(scripts/promote-release.sh --expect-stamp "$BIRDCAGE_RELEASE_REPO" "$commit")"
      mockingbird_digest="$(scripts/promote-release.sh --expect-stamp "$MOCKINGBIRD_RELEASE_REPO" "$commit")"
      nightjar_digest="$(scripts/promote-release.sh --expect-stamp "$NIGHTJAR_RELEASE_REPO" "$commit")"
      smb_lure_digest="$(scripts/promote-release.sh --expect-stamp "$SMB_LURE_RELEASE_REPO" "$commit")"
      holder_digest="$(scripts/promote-release.sh --expect-stamp "$HOLDER_RELEASE_REPO" "$commit")"
      opencanary_digest="$(scripts/promote-release.sh --expect-stamp "$OPENCANARY_RELEASE_REPO" "$commit")"
      # `latest` moves on every release. Whether a 0.x release is the
      # right thing to run is the decision of whoever pulls it, not this
      # pipeline's.
      #
      # What this pipeline is responsible for is narrower, and is met:
      # `latest` cannot point at an unapproved build. It is moved through
      # publish-channel.sh -- the same code that creates the `preview` tag
      # -- which re-verifies the validation evidence before it moves any
      # name at all. Nobody moves it by hand. A tag that moves is not a
      # weaker promise when the moving is gated.
      for pair in "${BIRDCAGE_RELEASE_REPO}|${birdcage_digest}" "${MOCKINGBIRD_RELEASE_REPO}|${mockingbird_digest}" "${NIGHTJAR_RELEASE_REPO}|${nightjar_digest}" "${SMB_LURE_RELEASE_REPO}|${smb_lure_digest}" "${HOLDER_RELEASE_REPO}|${holder_digest}" "${OPENCANARY_RELEASE_REPO}|${opencanary_digest}"; do
        BIRDCAGE_COMMIT="$commit" \
          scripts/publish-channel.sh "${pair%|*}" "${pair#*|}" latest
      done
      # The tag release:gitlab will create, decided here so one job reads
      # VERSION and the other cannot disagree with it.
      {
        echo "RELEASE_TAG=$(scripts/release-version.sh --tag)"
        echo "RELEASE_COMMIT=$commit"
      } > promotion.env
      cat promotion.env
  artifacts:
    reports:
      dotenv: promotion.env
    expire_in: 90 days

# Copies the version tag release:promote just created to GHCR, the same way
# release:mirror-preview copies `preview` -- see that job's comment for why
# this does not collide with the release guard's judge/ship rule. Needs
# release:promote's dotenv for RELEASE_TAG, so this cannot become playable
# until the button above has actually been pressed and has actually
# succeeded; GitLab holds it exactly like release:gitlab below.
release:mirror-release:
  stage: release
  image: $DOCKER_CLI_IMAGE
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  needs:
    - job: release:promote
      artifacts: true
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  <<: *mirror_login
  script:
    # release:promote is allow_failure, and a failed allow_failure job still
    # satisfies needs:, so this job starts even when promotion failed (#171).
    - 'test -n "${RELEASE_TAG:-}" || { echo "no RELEASE_TAG: release:promote did not finish"; exit 1; }'
    - |
      set -eu
      for pair in "${BIRDCAGE_RELEASE_REPO}|${BIRDCAGE_MIRROR_REPO}" "${MOCKINGBIRD_RELEASE_REPO}|${MOCKINGBIRD_MIRROR_REPO}" "${NIGHTJAR_RELEASE_REPO}|${NIGHTJAR_MIRROR_REPO}" "${SMB_LURE_RELEASE_REPO}|${SMB_LURE_MIRROR_REPO}" "${HOLDER_RELEASE_REPO}|${HOLDER_MIRROR_REPO}" "${OPENCANARY_RELEASE_REPO}|${OPENCANARY_MIRROR_REPO}"; do
        repo="${pair%|*}"
        mirror_repo="${pair#*|}"
        digest="$(scripts/mirror-image.sh "$repo" "$RELEASE_TAG" "$mirror_repo")"
        scripts/mirror-image.sh "$repo" "sha256-${digest#sha256:}" "$mirror_repo"
      done

# The annotated tag and the release note, created together once the digest
# has actually moved. The order matters: promote first, name second. If
# promotion refuses, nothing anywhere carries the version's name; if this
# job fails after a good promotion it can be retried on its own, without
# re-promoting, so a version is never burnt by a half-finished cut.
#
# release-cli creates the tag from `ref` using CI_JOB_TOKEN, which acts
# with the permissions of whoever pressed the button -- so a protected `v*`
# tag is created when the owner cuts the release and refused when someone
# without that right tries.
#
# Separate job because the `release:` keyword needs release-cli in the
# image, and because it must not be able to run unless the promotion
# succeeded: a release note pointing at images that were never promoted is
# worse than none.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  needs:
    - job: release:promote
      artifacts: true
  script:
    # Same reason as release:mirror-release (#171): without this an empty
    # tag reaches release-cli, because echo succeeds either way.
    - 'test -n "${RELEASE_TAG:-}" && test -n "${RELEASE_COMMIT:-}" || { echo "no RELEASE_TAG/RELEASE_COMMIT: release:promote did not finish"; exit 1; }'
    - echo "tagging $RELEASE_COMMIT as $RELEASE_TAG"
  release:
    tag_name: $RELEASE_TAG
    tag_message: birdcage $RELEASE_TAG
    ref: $CI_COMMIT_SHA
    name: $RELEASE_TAG
    description: |
      Images published by digest, promoted from the build `preview` tested:

      - `$BIRDCAGE_RELEASE_REPO:$RELEASE_TAG`
      - `$MOCKINGBIRD_RELEASE_REPO:$RELEASE_TAG`
      - `$NIGHTJAR_RELEASE_REPO:$RELEASE_TAG`
      - `$SMB_LURE_RELEASE_REPO:$RELEASE_TAG`
      - `$HOLDER_RELEASE_REPO:$RELEASE_TAG`
      - `$OPENCANARY_RELEASE_REPO:$RELEASE_TAG`

      Verify before you run either of them -- docs/releasing.md has the
      commands. Both carry a key-based validation attestation; the keyless
      countersignature is added by hand on GitHub after the cut.

sync:mirror-to-github:
  stage: sync
  image: $ALPINE_IMAGE
  needs: []
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
      variables:
        MIRROR_REF: refs/heads/$CI_COMMIT_BRANCH
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && $CI_COMMIT_TAG =~ /^v[0-9]/'
      variables:
        MIRROR_REF: refs/tags/$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is ${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH} protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # GitLab's variable editor trims the key's final newline and OpenSSH
    # refuses a key without one; put it back, and prove the key loads
    # before trying GitHub -- without printing any of it.
    - tr -d '\r' < "$GITHUB_MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
    - '[ -n "$(tail -c1 ~/.ssh/mirror_key)" ] && echo >> ~/.ssh/mirror_key || true'
    - 'head -1 ~/.ssh/mirror_key | grep -q "PRIVATE KEY" || { echo "GITHUB_MIRROR_SSH_KEY does not begin with a PRIVATE KEY header"; exit 1; }'
    - 'ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null || { echo "GITHUB_MIRROR_SSH_KEY is not a readable private key"; exit 1; }'
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/birdcage.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/birdcage.git
    # Push the ref by name, not HEAD. The runner checks out a detached
    # commit, and a release tag is an annotated object pointing at one:
    # `HEAD:refs/tags/v0.1.0` would land on GitHub as a bare tag with the
    # release note gone. Fetch the ref first so it exists locally.
    - git fetch --no-tags origin "+$MIRROR_REF:$MIRROR_REF"
    - git push github "$MIRROR_REF:$MIRROR_REF"
